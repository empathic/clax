# gitleaks configuration for this repository: gitleaks' default rules, plus
# an allowlist of four commits already on main whose `generic-api-key`
# findings are false positives. The allowlist is by commit, not by path, so
# the same files are still scanned in every later commit.
#
# - 4f06af15 (web/shell/src/inbox-groups.test.ts:9): the "key" is the
#   artifact ID 7q3k9mzx2b4t, a test fixture.
# - 8ad5c565 (web/shell/src/frame-src-cases.json:8-9): fixture "key" fields
#   of frame-source test cases (no longer in the file on main).
# - f1c07f34 (lineage_store_test.dart:10 and manifest.json:7): a test key
#   beside a sha256:1111... fixture, and the lineage author's Ed25519 public
#   key, which bundle_reader.dart's verifyManifest checks signatures with.
# - 20c92cf0 (docs/contract.md:8323): prose, "person's own key ... under a
#   32-byte key".

[extend]
useDefault = true

[allowlist]
description = "False positives in commits already on main (see the comments above)"
commits = [
  "4f06af15d181d71e81372b9a38e83e5a84b05b71",
  "8ad5c5651d1076321bb45d61a7831321ed56ebb7",
  "f1c07f346b1224ce3f13c186dcd9c4661a06ebc3",
  "20c92cf00e14bb857e729a16204e983de38e82db",
]
