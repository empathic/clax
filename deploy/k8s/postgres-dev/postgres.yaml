apiVersion: v1
kind: Service
metadata:
  name: clax-postgres
  labels:
    app.kubernetes.io/name: clax-postgres
spec:
  selector:
    app.kubernetes.io/name: clax-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clax-postgres
  labels:
    app.kubernetes.io/name: clax-postgres
spec:
  serviceName: clax-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clax-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clax-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: clax-postgres-dev
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "clax", "-d", "clax"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
