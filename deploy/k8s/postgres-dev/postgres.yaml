apiVersion: v1
kind: Service
metadata:
  name: clax-postgres
  labels:
    app.kubernetes.io/name: clax-postgres
spec:
  selector:
    app.kubernetes.io/name: clax-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# Only the fleet's pods reach the database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clax-postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: clax-postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: clax
              app.kubernetes.io/component: fleet
      ports:
        - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clax-postgres
  labels:
    app.kubernetes.io/name: clax-postgres
spec:
  serviceName: clax-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clax-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clax-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          # Every fleet pod holds CLAX_POSTGRES_POOL + 2 connections: room
          # for the autoscaler's 10 pods and a rollout's surge.
          args: ["-c", "max_connections=200"]
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: clax-postgres-dev
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "clax", "-d", "clax"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
