apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clax
spec:
  serviceName: clax-peers
  replicas: 2
  # Shards are independent: they start and stop together.
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: clax
      app.kubernetes.io/component: fleet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clax
        app.kubernetes.io/component: fleet
    spec:
      serviceAccountName: clax
      # SIGTERM drains: CLAX_FLEET_DRAIN_DELAY of serving while the Service
      # forgets the pod, every instance stopped (at most 10 s), then the
      # open connections (at most 10 s).
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clax-fleet
          image: ghcr.io/empathic/clax-fleet:latest
          args: ["serve"]
          ports:
            - name: http
              containerPort: 7480
            - name: admin
              containerPort: 7481
          env:
            - name: CLAX_FLEET_BACKEND
              value: sqlite
            - name: CLAX_FLEET_SHARDS
              value: "2"
            - name: CLAX_FLEET_PEER
              value: "clax-{shard}.clax-peers:7480"
            - name: CLAX_FLEET_CATALOG
              value: /etc/clax/fleet.toml
            - name: CLAX_FLEET_DATA_DIR
              value: /var/lib/clax
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          # Each instance's setup secret (its [hosted] setup_secret_env),
          # and CLAX_KEK when every shard should seal secrets under one key.
          envFrom:
            - secretRef:
                name: clax-secrets
                optional: true
          startupProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/clax
            - name: catalog
              mountPath: /etc/clax
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: catalog
          configMap:
            name: clax-fleet-catalog
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
