# The SQLite backend: a StatefulSet whose pods (clax-0, clax-1, …) each
# keep the homes of their shard's instances on a volume of their own.
#
#   kubectl create secret generic clax-secrets \
#     --from-literal=CLAX_FLEET_PEER_KEY="$(openssl rand -hex 32)" \
#     --from-literal=CLAX_SETUP_SECRET_EXAMPLE="$(openssl rand -hex 16)"
#   kubectl apply -k deploy/k8s/sqlite
#
# To scale out, raise `shards` in the catalog first (no pod restarts: each
# reloads it), then the StatefulSet's replicas (`kubectl scale sts clax
# --replicas=N`), and give new instances the new shards with create = true;
# an instance moves only with its home (docs/kubernetes.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - statefulset.yaml
  - peers.yaml
# The image every pod runs: a release's version, or your own build
# (`kustomize edit set image clax-fleet=<registry>/clax-fleet:<tag>`).
images:
  - name: clax-fleet
    newName: ghcr.io/empathic/clax-fleet
    newTag: "0.6.0"
