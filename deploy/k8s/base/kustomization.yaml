# What both backends share: the Service clients reach, the catalog, the
# service account and the disruption budget. An overlay adds the workload:
# sqlite/ (a StatefulSet of shards) or postgres/ (a Deployment and its
# autoscaler). docs/kubernetes.md walks through both.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: clax
      app.kubernetes.io/component: fleet
    includeSelectors: true
resources:
  - serviceaccount.yaml
  - service.yaml
  - pdb.yaml
  - networkpolicy.yaml
configMapGenerator:
  # The catalog (crates/clax-fleet/src/catalog.rs): every process reloads
  # it as the mounted file changes, so it keeps one name, and editing it
  # restarts nothing but the instances whose entry changed.
  - name: clax-fleet-catalog
    files:
      - fleet.toml
    options:
      disableNameSuffixHash: true
