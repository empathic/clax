# One pod at a time leaves for a voluntary disruption (a drain, an
# upgrade). On PostgreSQL its instances move to the others at once; on
# SQLite its shard's instances wait for it to come back.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: clax
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clax
      app.kubernetes.io/component: fleet
