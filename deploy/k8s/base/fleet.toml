# The instances the fleet serves (crates/clax-fleet/src/catalog.rs). Each
# is a hosted Clax at its own public origin; its `config` is the
# config.toml its home is given. Check a catalog before applying it, with
# the image (docs/kubernetes.md, The catalog):
#
#   clax-fleet check-catalog fleet.toml           # PostgreSQL
#   clax-fleet check-catalog fleet.toml --sqlite  # SQLite
#
# On the SQLite backend `shards` is the StatefulSet's replica count, and
# each instance names its `shard`: the pod (clax-<shard>) whose volume
# keeps it; `create = true` lets that pod make the instance's home, for a
# new instance only. The PostgreSQL backend ignores both and places
# instances itself. Never give a removed instance's name to another
# tenant: its data is kept under the name.

shards = 2

[[instance]]
name = "example"
shard = 0
create = true
default = true
config = '''
[hosted]
public_origin = "https://clax.example.com"
site_domain = "clax-sites.example.com"
# The setup secret the first visit to /setup asks for, from the
# environment (the clax-secrets Secret): one variable per instance.
setup_secret_env = "CLAX_SETUP_SECRET_EXAMPLE"
'''
