apiVersion: apps/v1
kind: Deployment
metadata:
  name: clax
spec:
  # No replicas: the HorizontalPodAutoscaler (hpa.yaml) owns the count, and
  # a replicas here would reset it at every apply. Without the autoscaler,
  # add it back.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: clax
      app.kubernetes.io/component: fleet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clax
        app.kubernetes.io/component: fleet
    spec:
      serviceAccountName: clax
      # SIGTERM drains: CLAX_FLEET_DRAIN_DELAY of serving while the Service
      # forgets the pod, every instance stopped and its lease released (at
      # most 10 s; the others take them at their next request), then the
      # open connections (at most 10 s).
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: clax
              app.kubernetes.io/component: fleet
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clax-fleet
          # Set by the overlay's `images` (kustomization.yaml).
          image: clax-fleet
          args: ["serve"]
          ports:
            - name: http
              containerPort: 7480
            - name: admin
              containerPort: 7481
          env:
            - name: CLAX_FLEET_BACKEND
              value: postgres
            - name: CLAX_FLEET_CATALOG
              value: /etc/clax/fleet.toml
            - name: CLAX_FLEET_DATA_DIR
              value: /var/lib/clax
            # Other pods forward to this one at the pod's IP.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # TLS to the database, required (never a fallback to plain
            # text). postgres-dev turns it off for its in-cluster database.
            - name: CLAX_POSTGRES_TLS
              value: "on"
            # A managed database's own CA, trusted in place of the public
            # roots: mount it from a Secret (the commented volume below).
            # - name: CLAX_POSTGRES_CA
            #   value: /etc/clax/postgres-ca/ca.pem
          # CLAX_POSTGRES_URL, CLAX_KEK and each instance's setup secret
          # (CLAX_FLEET_PEER_KEY is kept in the database when unset). Pods
          # read them at start: `kubectl rollout restart deploy/clax` after
          # adding an instance's secret or rotating one.
          envFrom:
            - secretRef:
                name: clax-secrets
          startupProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
          # Memory: 1 Gi reserved (a pod and about three busy instances), up
          # to 2 Gi (about seven); docs/kubernetes.md, Sizing. Ephemeral
          # storage covers the data and tmp volumes below.
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
              ephemeral-storage: 1Gi
            limits:
              memory: 2Gi
              ephemeral-storage: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # The instances' homes: their config, the audit journal's
            # export and caches, all made again on any pod.
            - name: data
              mountPath: /var/lib/clax
            - name: catalog
              mountPath: /etc/clax
              readOnly: true
            - name: tmp
              mountPath: /tmp
            # - name: postgres-ca
            #   mountPath: /etc/clax/postgres-ca
            #   readOnly: true
      volumes:
        # - name: postgres-ca
        #   secret:
        #     secretName: clax-postgres-ca
        # On the node's disk, bounded so that a pod that fills one is
        # evicted alone, before the node comes under disk pressure.
        - name: data
          emptyDir:
            sizeLimit: 4Gi
        - name: catalog
          configMap:
            name: clax-fleet-catalog
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
