# ClaxBot's workspace for Clax: copy to <home>/workspace.toml. README.md here
# says what it needs and what to replace.

# No image is published for this: the repository's own (deploy/Dockerfile)
# is the runtime, with no toolchain. Unset, the service refuses to start. On
# Daytona this is a snapshot's name, sized and x86-64 (README.md, "A snapshot on
# Daytona"), of clax-image.Dockerfile, which has git 2.44 or later (Ubuntu
# 24.04's 2.43 fails 19 of clax-core's tests), and:
#   Bazel 9.3.0 through bazelisk (.bazelversion), which `just` prefers
#   Rust 1.94.0 with wasm32-unknown-unknown (rust-toolchain.toml)
#   Node 26 (preview.yml) and pnpm 12.3.4 (web/package.json)
#   clang, lld and llvm for the wasm32 Worker (preview.yml)
#   Python 3.11+ for `just`
# image = "clax-workspace-1"
auto_stop_minutes = 30

# What MODULE.bazel, the lockfiles and preview.yml fetch from, with the
# hosts GitHub's archives and releases redirect to (rules_nodejs takes Node
# from nodejs.org, rules_python its interpreter from a GitHub release). Not
# measured by a full build in a container: add what the first one is refused.
# The Flutter app's hosts are left out.
domain_allow_list = [
  "github.com",
  "codeload.github.com",
  "objects.githubusercontent.com",
  "release-assets.githubusercontent.com",
  "index.crates.io",
  "static.crates.io",
  "static.rust-lang.org",
  "bcr.bazel.build",
  "releases.bazel.build",
  "registry.npmjs.org",
  "nodejs.org",
  "pypi.org",
  "files.pythonhosted.org",
  "cdn.playwright.dev",
  # The Android SDK and NDK, which Bazel fetches even for a Rust library's
  # test: every build fails without it.
  "dl.google.com",
]

[runtime]
kind = "daytona"

[[target]]
# The ID of the queue whose reports are for Clax. A hosted instance makes
# `clax-feedback` itself (docs/feedback.md), with an ID of its own: until
# this is one, no run matches this target.
queue = "REPLACE_WITH_QUEUE_ID"
# Where a pull request links its report: the same queue's ID. Only the queue's
# members can open it, so a public pull request shows no more than the ID.
report_url = "https://clax.dev/queues/REPLACE_WITH_QUEUE_ID/{report}"
repo_url = "https://github.com/empathic/clax.git"
repo = "empathic/clax"
base = "main"
# install.sh fetches releases of this repository unauthenticated, so it is
# read as public, and a container clones it with no token.
public = true
# preview.yml deploys only on a person's `/preview <SHA>`.
reviewed_previews = true
# What a queue's members are told to do to bring a held fix's preview up.
preview_gate = "read the change, then, with write access, post `/preview {commit}` on the pull request"
# The repository is public and anyone signed in to clax.dev files reports, so
# a reporter's word starts no run here: a member's Send is the review of what a
# run reads.
follow_ups = false
# What a run reads of how to work here, beside AGENTS.md. A cold
# //crates/clax-core:clax_core_lib_test took 371 s in a container.
guidance = """
Build and test with Bazel through `just`, not cargo.
A first build is slow: give `clax.shell.exec` `timeout: 600`, and start with \
narrow targets such as `bazelisk test //crates/<crate>:...`.
The `title` of `clax.change.propose` is the commit's subject, and must be a \
conventional commit: `type(scope): summary`. Add no attribution lines.
You may not change manifests, lockfiles or build scripts, nor the code of \
sign-in, authorization and report queues, which includes the auth and queue \
routes: a change that touches them is refused when you propose it, and the \
refusal names the path. If a fix needs one, stop and say so in your answer \
rather than working towards it.
Refused the same way, so check before a slow build: migrations \
(crates/clax-store/src/migrations.rs), ClaxBot's own crates (crates/clax-bot*), \
the server's crates/clax-server/src/bot.rs and router.rs, web/sdk/, and anything \
outside `writable_paths`. `writable_paths` and `protected_paths` in \
deploy/claxbot-workspace/clax.toml, here in the repository, are the whole list.
web/perf/bundle-budget.json is refused too: a change that crosses a bundle \
budget cannot raise it, so measure before you add to the web bundles.
Write no qualifier records, whatever AGENTS.md says of them: those files are \
refused here, and what you found goes in the proposal's summary.
Write a test first, and watch it fail, for each change of behaviour.
"""
# What a target's model may keep open and push in a day.
max_open_pull_requests = 3
max_pushes_per_day = 10

# Where a change may write. Nothing outside this is a change a model makes
# here: no manifest, build script, lockfile or workflow is inside it.
writable_paths = [
  "crates/*/src/",
  "crates/*/tests/",
  "web/shell/src/",
  "web/overlay/src/",
  "web/e2e/",
  "docs/",
]

# Subtracts from writable_paths, and stays right if that list grows. These
# reach past a preview: what builds, what deploys, what signs in and what says
