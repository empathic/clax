# A tripwire, and no control: it catches the plain way of pointing a `mod` at a
# protected file from a writable one, a `#[path]` or a `cfg_attr` carrying it,
# whitespace aside. A macro, a raw string or an `include!` of another extension
# gets past it, and a writable `lib.rs` can swap a module with no attribute at
# all. Only the daemon checks it. A person's review of the diff is the control,
# so adding patterns here adds nothing.
refused_in_rust = ["#[path", ",path=\""]

# PREVIEW_HOST_ZONE, as chosen for the `preview` environment
# (docs/environments.md). ClaxBot's pull request deploys only on a person's
# `/preview <SHA>`, so a fix is held until then: its reporter is asked nothing,
# and hears of it when the preview comes up. The queue's notifier tells its people
# at the proposal. The wait is detached from the run and outlives it; if it ends
# with no preview seen the queue's members are told, on the report and on the stream,
# and a preview that comes up later than this reaches nobody unless a member hands
# the fix over with its link. A person reads the change first and a deploy has taken
# 10 to 20 minutes, so this is a day, the most a wait may be, and a look a minute.
preview_url = "https://pr-{pr}.clax-preview.dev"
preview_ready_path = "/healthz"
# `commit` in the answer is the full SHA: preview.yml checks out the pull
# request's head and deploy.mjs builds that in as CLAX_BUILD_COMMIT.
preview_names_commit = true
preview_timeout_secs = 86400
preview_poll_secs = 60

# Last in the file: TOML reads what follows a table as part of it. The App's
# tokens are minted per repository and its commits are signed by GitHub. It
# needs Contents and Pull requests read and write on this repository, and no
# Workflows permission; replace both numbers.
[target.github_app]
app_id = 0
installation_id = 0
private_key_env = "CLAXBOT_CLAX_APP_KEY"
