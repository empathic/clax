  "crates/clax-worker/deploy.mjs",
  "crates/clax-worker/teardown.mjs",
  "crates/clax-worker/wrangler.jsonc",
  "crates/clax-worker/smoke-remote.mjs",
  "crates/clax-worker/harness.mjs",
  # Release.
  "install.sh",
  "scripts/carry-release.sh",
  "scripts/check-release-head.sh",
  "scripts/lib/release-common.sh",
  "scripts/package-release.sh",
  "scripts/pin-release.sh",
