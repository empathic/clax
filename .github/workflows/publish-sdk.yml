name: Publish SDK package

# Publishes web/dist-sdk to npm as @empathic/clax-sdk (built by
# web/scripts/build-sdk.mjs at the workspace's version in Cargo.toml), run
# by hand (Actions, Publish SDK package, Run workflow) or by
# scripts/release.sh after the Pi package (docs/usage.md, "Releasing"). It
# publishes from the commit `sha` names (by default the tip of the ref it
# runs on), which must be on prod, where releases come from, with CI
# passed on it. It builds the package and runs its test (pnpm run
# build:sdk, test:sdk), and refuses a version npm already has. With
# `dry_run` it does everything but publish. The run is titled "Publish SDK
# package <sha>", or "Publish SDK package (dry run) <sha>", so a caller can
# find it.
#
# It publishes through npm trusted publishing (OIDC, no token) with
# provenance, as publish-pi.yml does, so the package on npmjs.com must name
# this repository, this workflow and the environment `npm` as its trusted
# publisher. The job runs in that environment, whose deployment branches the
# repository's settings limit to prod, so npm refuses a token from a run
# dispatched on any other ref. npm offers trusted publishing only for a
# package that exists, so the first version is not published here:
# scripts/release.sh publishes it from the releaser's machine (built in a
# worktree of the pin commit on prod) and prints that setup.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, test and pack only; publish nothing"
        type: boolean
        default: true
      sha:
        description: "The commit to publish from: on prod, with CI passed (default: the tip of the ref run on)"
        type: string
        default: ""

run-name: >-
  ${{ inputs.dry_run && 'Publish SDK package (dry run)' || 'Publish SDK package' }}
  ${{ inputs.sha || github.sha }}

permissions:
  contents: read

concurrency:
  group: publish-sdk
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @empathic/clax-sdk
    # GitHub's runner, not Blacksmith's: npm's trusted publishing and its
    # provenance accept only GitHub-hosted runners.
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
      - name: Check the commit is on prod and CI passed on it
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse --verify "$SHA^{commit}")"
          git fetch --quiet --no-tags origin prod
          if ! git merge-base --is-ancestor "$sha" FETCH_HEAD; then
            echo "$sha is not on prod: the SDK package is published from the pin commit on prod" >&2
            exit 1
          fi
          # The gate is ci.yml's bazel job (which runs //web:sdk_package):
          # the run's own conclusion also counts perf-log, which is
          # cancelled when pushes pile up.
          run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event push --commit "$sha" \
            --limit 1 --json databaseId --jq '.[0].databaseId // ""')"
          conclusion=""
          if [ -n "$run" ]; then
            conclusion="$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json jobs \
              --jq '.jobs[] | select(.name == "bazel") | .conclusion')"
          fi
          if [ "$conclusion" != success ]; then
            echo "CI's bazel job has not passed on $sha (${conclusion:-no run}): publish from a commit CI passed" >&2
            exit 1
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { package_json_file: web/package.json }
      # The Node the web build runs under Bazel (MODULE.bazel's node.toolchain).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: Install npm 11
        run: npm install -g npm@11
      - name: Build and test
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:sdk
          pnpm run test:sdk
      - name: Check the version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./dist-sdk/package.json").version')"
          if [ "$(npm view "@empathic/clax-sdk@$version" version 2>/dev/null || true)" = "$version" ]; then
            echo "@empathic/clax-sdk@$version is already on npm" >&2
            exit 1
          fi
      - name: Pack
        working-directory: web/dist-sdk
        run: npm pack --dry-run
      - name: Publish
        if: ${{ !inputs.dry_run }}
        working-directory: web/dist-sdk
        run: npm publish --provenance --access public
