name: Publish SDK package

# Publishes web/dist-sdk to npm as @empathic/clax-client-sdk (built by
# web/scripts/build-sdk.mjs at the package's own version, the version in
# web/sdk/package.json). scripts/release-sdk.sh, `just release-sdk`
# (docs/usage.md, "Releasing the SDK package"), dispatches it once it has
# pushed the tag sdk-vX.Y.Z; a run by hand (Actions, Publish SDK package,
# Run workflow) publishes only a commit that tag names, and a dry run
# needs no tag. It publishes from the commit `sha` names (by default the
# tip of the ref it runs on), which must be on prod, where Clax releases
# go, with CI passed on it: a published SDK then calls only the
# report-queue routes that deployed instances have. It builds the package
# and runs its test (pnpm run build:sdk, test:sdk), and refuses a version
# npm already has. With `dry_run` it does everything but publish. The run
# is titled "Publish SDK package <sha>", or "Publish SDK package (dry run)
# <sha>", so a caller can find it.
#
# It publishes through npm trusted publishing (OIDC, no token) with
# provenance, as publish-pi.yml does, so the package on npmjs.com must name
# this repository, this workflow and the environment `npm` as its trusted
# publisher. Only the `publish` job runs in that environment, whose
# deployment branches the repository's settings limit to prod, so npm
# refuses a token from a run dispatched on any other ref; and only it may
# request the token, so no build or test code (the web workspace's
# dependencies) runs where the token can be had: the `build` job packs the
# tarball, and `publish` runs nothing but a pinned npm on it. npm offers
# trusted publishing only for a package that exists, so the first version
# is not published here: scripts/release-sdk.sh publishes it from the
# releaser's machine (built in a worktree of the commit on prod) and
# prints that setup.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, test and pack only; publish nothing"
        type: boolean
        default: true
      sha:
        description: "The commit to publish from: on prod, with CI passed (default: the tip of the ref run on)"
        type: string
        default: ""

run-name: >-
  ${{ inputs.dry_run && 'Publish SDK package (dry run)' || 'Publish SDK package' }}
  ${{ inputs.sha || github.sha }}

permissions:
  contents: read

concurrency:
  group: publish-sdk
  cancel-in-progress: false

jobs:
  build:
    name: Build and pack @empathic/clax-client-sdk
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
      - name: Check the commit is on prod, carries its tag, and CI passed on it
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha || github.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse --verify "$SHA^{commit}")"
          git fetch --quiet --no-tags origin prod
          if ! git merge-base --is-ancestor "$sha" FETCH_HEAD; then
            echo "$sha is not on prod: the SDK package is published from a commit on prod" >&2
            exit 1
          fi
          # A publish is of the commit `just release-sdk` tagged: the tag
          # names what was published, and the command can finish the
          # release afterwards.
          if [ "$DRY_RUN" != true ]; then
            version="$(jq -r .version web/sdk/package.json)"
            tag="sdk-v$version"
            if ! git fetch --quiet --no-tags origin "refs/tags/$tag"; then
              echo "origin has no tag $tag: publish $version with just release-sdk $version, which tags $sha first" >&2
              exit 1
            fi
            tagged="$(git rev-parse --verify "FETCH_HEAD^{commit}")"
            if [ "$tagged" != "$sha" ]; then
              echo "the tag $tag names $tagged, not $sha: publish the commit the tag names" >&2
              exit 1
            fi
          fi
          # The gate is ci.yml's bazel job (which runs //web:sdk_package):
          # the run's own conclusion also counts perf-log, which is
          # cancelled when pushes pile up.
          run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event push --commit "$sha" \
            --limit 1 --json databaseId --jq '.[0].databaseId // ""')"
          conclusion=""
          if [ -n "$run" ]; then
            conclusion="$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json jobs \
              --jq '.jobs[] | select(.name == "bazel") | .conclusion')"
          fi
          if [ "$conclusion" != success ]; then
            echo "CI's bazel job has not passed on $sha (${conclusion:-no run}): publish from a commit CI passed" >&2
            exit 1
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { package_json_file: web/package.json }
      # The Node the web build runs under Bazel (MODULE.bazel's node.toolchain).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build and test
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:sdk
          pnpm run test:sdk
      - name: Check the version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./dist-sdk/package.json").version')"
          if [ "$(npm view "@empathic/clax-client-sdk@$version" version 2>/dev/null || true)" = "$version" ]; then
            echo "@empathic/clax-client-sdk@$version is already on npm" >&2
            exit 1
          fi
      - name: Pack
        working-directory: web/dist-sdk
        run: |
          mkdir -p "$RUNNER_TEMP/sdk-package"
          npm pack --pack-destination "$RUNNER_TEMP/sdk-package"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-package
          path: ${{ runner.temp }}/sdk-package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish @empathic/clax-client-sdk
    needs: build
    if: ${{ !inputs.dry_run }}
    # GitHub's runner, not Blacksmith's: npm's trusted publishing and its
    # provenance accept only GitHub-hosted runners.
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-package
          path: sdk-package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      # An exact version: nothing unpinned runs where the token can be had.
      - name: Install npm
        run: npm install -g npm@11.6.2
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          tarballs=(sdk-package/*.tgz)
          if [ "${#tarballs[@]}" != 1 ]; then
            echo "expected one tarball, found: ${tarballs[*]}" >&2
            exit 1
          fi
          npm publish "${tarballs[0]}" --provenance --access public
