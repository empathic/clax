name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          # Linux builds are static musl binaries, so they run on any glibc.
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: 1.94.0, targets: "${{ matrix.target }}" }

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }

      - name: Install musl-tools
        if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: extractions/setup-just@v2

      # The web bundle in web/dist is embedded into the binary at build time.
      - name: Build web bundle
        run: just web

      - name: Build
        # cc looks for aarch64-linux-musl-gcc, which musl-tools does not
        # install; on the arm64 runner the native musl-gcc targets it.
        env:
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target ${{ matrix.target }} -p clax-cli --bin clax

      - name: Package
        shell: bash
        run: |
          tar czf clax-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release clax
          sha256sum clax-${{ matrix.target }}.tar.gz > clax-${{ matrix.target }}.tar.gz.sha256 2>/dev/null || \
            shasum -a 256 clax-${{ matrix.target }}.tar.gz > clax-${{ matrix.target }}.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: clax-${{ matrix.target }}
          path: |
            clax-${{ matrix.target }}.tar.gz
            clax-${{ matrix.target }}.tar.gz.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
