name: Release

# A v* tag builds, checks and publishes a release, with a SOURCE_TREE asset
# naming the tree it was built from. A manual run, or a pull request that
# touches the release path, runs the same jobs without publishing; its
# result is the workflow artifact `release-dist`. A tag whose release exists
# already, built from the same tree (the tag moved to a re-signed copy of
# its commit), finishes without building or uploading anything; one whose
# release was built from another tree fails (scripts/release-exists-check.sh).
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/package-release.sh"
      - "scripts/check-version.sh"
      - "scripts/smoke-release-binary.sh"
      - "install.sh"
      - "scripts/ensure-clax.sh"
      - "scripts/pin-release.sh"
      - "scripts/release-exists-check.sh"
      - "rust-toolchain.toml"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check versions
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish == 'true' && steps.existing.outputs.skip != 'true' }}
      skip: ${{ steps.existing.outputs.skip == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            scripts/check-version.sh "$GITHUB_REF_NAME"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            scripts/check-version.sh
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$(scripts/check-version.sh --print)" >> "$GITHUB_OUTPUT"
      - id: existing
        name: Check for a release of this tag
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/release-exists-check.sh "$GITHUB_REF_NAME" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every target builds natively; no cross toolchain. Blacksmith
          # has no Intel Mac, so x86_64-apple-darwin builds on GitHub's,
          # where its smoke test runs the binary natively.
          - { target: aarch64-apple-darwin, os: blacksmith-6vcpu-macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: x86_64-unknown-linux-musl, os: blacksmith-4vcpu-ubuntu-2404 }
          - { target: aarch64-unknown-linux-musl, os: blacksmith-4vcpu-ubuntu-2404-arm }
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml's version, with the target.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      # pnpm at the version web/package.json names (packageManager).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - name: Install musl-tools
        if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # A release build embeds web/dist, so the web UI is built first, with
      # pnpm as the binary is built with cargo: the runners carry bazelisk,
      # and a Bazel build leaves no pnpm store for setup-node's cache.
      - name: Build web bundle
        env:
          CLAX_BUILD: native
        run: just web
      - name: Build
        # cc looks for aarch64-linux-musl-gcc, which musl-tools does not
        # install; on the arm64 runner the native musl-gcc targets it.
        env:
          CC_aarch64_unknown_linux_musl: musl-gcc
          # The commit `clax --version` names (crates/clax-cli/build.rs).
          CLAX_BUILD_COMMIT: ${{ github.sha }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p clax-cli --bin clax
      - name: Smoke-test the binary
        shell: bash
        run: scripts/smoke-release-binary.sh "target/${{ matrix.target }}/release/clax" "$VERSION"
      - name: Package
        shell: bash
        run: scripts/package-release.sh archive "$VERSION" ${{ matrix.target }} "target/${{ matrix.target }}/release/clax" dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clax-${{ matrix.target }}
          path: dist/clax-${{ env.VERSION }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  assemble:
    name: Assemble, and install through install.sh and the plugins' wrapper
    needs: [version, build]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { path: dist, pattern: "clax-*", merge-multiple: true }
      # SOURCE_TREE names the tree the release is built from, which
      # scripts/release-exists-check.sh and scripts/release.sh judge it by.
      - name: Add install.sh, the source tree and checksums
        shell: bash
        run: |
          cp install.sh dist/install.sh
          git rev-parse 'HEAD^{tree}' > dist/SOURCE_TREE
          scripts/package-release.sh sums dist
          cat dist/SHA256SUMS
          test "$(find dist -mindepth 1 -maxdepth 1 | wc -l)" = 7
      - name: Install through install.sh from a local copy of the release
        shell: bash
        run: |
          serve="$RUNNER_TEMP/serve"
          mkdir -p "$serve/v$VERSION"
          cp dist/* "$serve/v$VERSION/"
          (cd "$serve" && exec python3 -u -m http.server 0 --bind 127.0.0.1 > "$RUNNER_TEMP/http.log" 2>&1) &
          for _ in $(seq 50); do
            port="$(sed -n 's#.*http://127.0.0.1:\([0-9]*\)/.*#\1#p' "$RUNNER_TEMP/http.log" | head -1)"
            [ -n "$port" ] && break
            sleep 0.2
          done
          export HOME="$RUNNER_TEMP/home" CLAX_RELEASE_BASE_URL="http://127.0.0.1:$port"
          bash dist/install.sh "$VERSION"
          test "$("$HOME/.local/bin/clax" --version)" = "clax $VERSION"
          # The plugins' route: pin this release (as scripts/pin-release.sh
          # does after publishing) and let the wrapper download, check and
          # install it into a fresh Clax home.
          scripts/pin-release.sh "v$VERSION"
          export CLAX_HOME="$RUNNER_TEMP/clax-home"
          unset CLAX_BIN
          bin="$(plugins/claude-code/scripts/ensure-clax.sh)"
          test "$bin" = "$CLAX_HOME/bin/$VERSION/clax"
          test "$(plugins/clax/scripts/ensure-clax.sh exec --version)" = "clax $VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: release-dist, path: dist/, if-no-files-found: error }

  publish:
    name: Publish ${{ github.ref_name }}
    needs: [version, assemble]
    if: needs.version.outputs.publish == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: release-dist, path: dist }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Clax ${{ needs.version.outputs.version }}" \
            --generate-notes --verify-tag
