name: ci
on: { push: { branches: [main] }, pull_request: {} }
permissions: { contents: read }
# One job, through Bazel (docs/bazel.md, "CI"): `scripts/bazel-test.sh --ci`
# checks what scripts/quality_gates.sh checks with Cargo and pnpm. The native
# gates do not run here; they are a manual workflow (native-check.yml).
jobs:
  bazel:
    runs-on: ubuntu-latest
    # A run with nothing restored compiles every dependency; until a green
    # push to main has saved a cache, every run is one.
    timeout-minutes: 60
    steps:
      # The full history and its tags: scripts/test-plugins.sh checks the
      # plugins' pinned release against the newest v* tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }

      # Bazelisk, and Bazel's disk cache and downloads from main's newest
      # green run. A pull request reads that cache and saves nothing.
      - id: bazel
        uses: ./.github/actions/setup-bazel

      # Only for `cargo metadata` and `cargo tree` in
      # scripts/bazel-sync.sh --check, which compile nothing; Bazel fetches
      # its own compiler, Node and packages. rustup reads rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      # scripts/test-justfile.sh and scripts/test-dev.sh run `just`.
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      # Chromium's system libraries, installed by the locked Playwright
      # (which runs apt through sudo); the browser itself comes from Bazel.
      - name: Install Chromium's system libraries
        run: bazelisk run //web:playwright -- install-deps chromium

      # Every check: the sync check, format and clippy, the Rust tests, the
      # web and Pi checks, the script gates, the checks run outside Bazel
      # and the hard-link scan. Performance is measured on demand (`just
      # perf`), not here. Each phase's time goes to the job summary.
      - name: Run scripts/bazel-test.sh --ci
        run: scripts/bazel-test.sh --ci

      # Also after a timeout, when the logs matter most.
      - name: Keep the test logs
        if: ${{ !success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bazel-testlogs
          path: |
            bazel-testlogs/**/test.log
            bazel-testlogs/**/test.xml
            bazel-testlogs/web/**/test.outputs/**
          retention-days: 14

      # Stop the server before the cache is trimmed and saved.
      - name: Stop Bazel
        if: ${{ always() }}
        run: bazelisk shutdown || true

      # Bazel trims its disk cache only while a server sits idle, which a CI
      # job never does: the restored cache plus this run's outputs is
      # trimmed to the `ci` config's bound before it is saved, least
      # recently used first.
      - name: Trim the cache
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: BAZEL_GC_MAX_SIZE_GB=6 scripts/bazel-gc.sh --report

      # Main's cache, saved only after every step passed, is what every
      # later run starts from.
      - name: Save the cache
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: ${{ steps.bazel.outputs.cache-key }}

  # The perf benchmarks after every green push to main, kept in a log, never
  # a gate (docs/usage.md, "Developing Clax"): each run appends one JSON line to
  # perf/log.jsonl on the orphan branch `perf-log`, which
  # `scripts/perf-log.sh show` reads. A number never fails this job; only
  # broken tooling does.
  perf-log:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: bazel
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The one job that writes: the log branch, with GITHUB_TOKEN.
    permissions: { contents: write }
    # One run at a time appends; a later push waits rather than races.
    concurrency: { group: perf-log, cancel-in-progress: false }
    steps:
      # Its credentials stay for scripts/perf-log.sh publish's push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bazel
      - name: Install Chromium's system libraries
        run: bazelisk run //web:playwright -- install-deps chromium
      # The measuring may fail (a benchmark that cannot finish); the record
      # is still made from whatever was measured.
      - name: Run the benchmarks
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/perf"
          bazelisk test --nocache_test_results --test_output=all --test_timeout=1800 \
            --test_env=CLAX_PERF_JSON="$RUNNER_TEMP/perf/metrics.jsonl" \
            --sandbox_writable_path="$RUNNER_TEMP/perf" \
            //scripts:perf_daemon_full //scripts:perf_clients_full //web:perf_usable_full //web:bundle_size
      - name: Append the run to the perf log
        run: |
          scripts/perf-log.sh record "$RUNNER_TEMP/perf/metrics.jsonl" > "$RUNNER_TEMP/perf/record.jsonl"
          { echo '**perf log record**'; echo '```'; cat "$RUNNER_TEMP/perf/record.jsonl"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          scripts/perf-log.sh publish "$RUNNER_TEMP/perf/record.jsonl"
      - if: always()
        run: bazelisk shutdown || true
