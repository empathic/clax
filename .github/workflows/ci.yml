name: ci
on: { push: { branches: [main] }, pull_request: {} }
permissions: { contents: read }
# One job through Bazel (docs/bazel.md, "CI"): `scripts/bazel-test.sh --ci`
# checks what scripts/quality_gates.sh checks with Cargo and pnpm, the quick
# checks first. The native gates do not run here; they are a manual
# workflow (native-check.yml). Every job runs on Blacksmith.
jobs:
  bazel:
    # Every core is Bazel's (.bazelrc); the browser tests take eight each.
    runs-on: blacksmith-16vcpu-ubuntu-2404
    # A run with no committed disk compiles every dependency; until a push
    # to main has committed one, every run is one.
    timeout-minutes: 60
    steps:
      # The full history and its tags: scripts/test-plugins.sh checks the
      # plugins' pinned release against the newest v* tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }

      # Bazel with its state from main's last committed run, so this run
      # rebuilds and retests only what its change touches. A push to main
      # keeps its changes to that state when every step succeeds; a pull
      # request reads main's state and its writes are dropped.
      - uses: ./.github/actions/setup-bazel
        with:
          name: bazel
          commit: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # Only for `cargo metadata` and `cargo tree` in
      # scripts/bazel-sync.sh --check, which compile nothing; Bazel fetches
      # its own compiler, Node and packages. rustup reads rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      # scripts/test-justfile.sh and scripts/test-dev.sh run `just`.
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      # Chromium's system libraries, installed by the locked Playwright
      # (which runs apt through sudo); the browser itself comes from Bazel.
      - name: Install Chromium's system libraries
        run: bazelisk run //web:playwright -- install-deps chromium

      # Every check: the sync check, then the quick checks (format, clippy,
      # the web lint, the script gates that need no clax), stopping there
      # on a failure, then the Rust tests, the web and Pi checks, the other
      # script gates and the checks run outside Bazel. Performance is
      # measured on demand (`just perf`), not here. Each phase's time goes
      # to the job summary.
      - name: Run scripts/bazel-test.sh --ci
        run: scripts/bazel-test.sh --ci

      # Also after a timeout, when the logs matter most.
      - name: Keep the test logs
        if: ${{ !success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bazel-testlogs
          path: |
            bazel-testlogs/**/test.log
            bazel-testlogs/**/test.xml
            bazel-testlogs/web/**/test.outputs/**
          retention-days: 14

      # Stop the server so the disk is quiet when it is committed.
      - name: Stop Bazel
        if: ${{ always() }}
        run: bazelisk shutdown || true

  # When the bazel job fails on a push to main, its disk is discarded (a
  # failed step commits nothing), and every later run would start from an
  # older one. This builds the same targets, runs no test, and commits the
  # disk if the build succeeds, so a failing test or lint does not leave
  # main's state behind; a compile error does.
  bazel-seed:
    needs: bazel
    if: ${{ !cancelled() && needs.bazel.result == 'failure' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-bazel
        with:
          name: bazel
          commit: "true"
      # The targets of scripts/bazel-test.sh --ci's test pass, built and not
      # run.
      - name: Build
        run: |
          listed="$(bazelisk query 'tests(//...) except attr(tags, "\bmanual\b", //...)')"
          mapfile -t tests <<< "$listed"
          bazelisk build --keep_going //crates/... //web:playwright "${tests[@]}"
      # The format and clippy aspects the next run's quick checks start
      # with. A lint that fails (often why the bazel job did) leaves the
      # rest of them cached, so this step does not fail on one.
      - name: Build the format and clippy checks
        run: |
          bazelisk build --keep_going --config=fmt --output_groups=rustfmt_checks //crates/... ||
            echo "a format check fails; the others are kept"
          bazelisk build --keep_going --config=clippy --output_groups=clippy_checks //crates/... ||
            echo "a clippy check fails; the others are kept"
      - name: Stop Bazel
        if: ${{ always() }}
        run: bazelisk shutdown || true

  # What Bazel does not build: crates/clax-worker, a workspace of its own
  # with its own Cargo.lock that builds for wasm32 only, and the wasm32 check
  # of the crates a hosted Worker runs (scripts/check-wasm.sh). Natively, as
  # scripts/quality_gates.sh runs them in its worker and wasm32 lanes; the
  # runner's clang and llvm-ar target wasm32. The Worker's format check is
  # the bazel job's (//crates/clax-worker:rustfmt), with the rustfmt the
  # rest of the repository is checked with. A job beside the bazel job
  # rather than steps in it: it shares nothing with Bazel's cache, and in
  # parallel it adds nothing to the run's time.
  worker:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # rust-toolchain.toml's version, with the wasm32-unknown-unknown target.
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: ". -> target\ncrates/clax-worker -> target" }
      # pnpm for the web UI the Worker's e2e serves and drives Playwright from.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Check the Worker's crates for wasm32
        run: scripts/check-wasm.sh
      # Before the Worker builds: it embeds web/dist (crates/clax-worker/
      # build.rs refuses a wasm32 build without it).
      - name: Build the web UI
        run: scripts/pnpm-install-stamped.sh web --silent && scripts/build-web.sh
      # Its tests, clippy, and the wasm build under wrangler (test-wasm.mjs).
      - name: Run the Worker's checks (scripts/worker-checks.sh)
        run: scripts/worker-checks.sh
      - name: Install Chromium
        run: cd web && pnpm exec playwright install --with-deps chromium
      # The Clax server in its Durable Object under wrangler dev --local, in
      # two browsers, on the build test-wasm.mjs made.
      - name: Run the Worker's e2e
        run: cd crates/clax-worker && node e2e.mjs --no-build

  # The perf benchmarks after every green push to main, kept in a log, never
  # a gate (docs/usage.md, "Developing Clax"): each run appends one JSON line to
  # perf/log.jsonl on the orphan branch `perf-log`, which
  # `scripts/perf-log.sh show` reads. A number never fails this job; only
  # broken tooling does.
  perf-log:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: bazel
    # Four cores, as GitHub's ubuntu-latest had before the log's records
    # from 2026-10-21 on: earlier records ran on GitHub's runners.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    # It runs what the sticky disk holds, so it holds no write token: the
    # record goes to perf-log-publish as a workflow artifact.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # main's committed state, read only: the bazel job, which ran just
      # before, built most of what the benchmarks need.
      - uses: ./.github/actions/setup-bazel
        with:
          name: bazel
          commit: "false"
      - name: Install Chromium's system libraries
        run: bazelisk run //web:playwright -- install-deps chromium
      # The measuring may fail (a benchmark that cannot finish); the record
      # is still made from whatever was measured.
      - name: Run the benchmarks
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/perf"
          bazelisk test --nocache_test_results --test_output=all --test_timeout=1800 \
            --test_env=CLAX_PERF_JSON="$RUNNER_TEMP/perf/metrics.jsonl" \
            --sandbox_writable_path="$RUNNER_TEMP/perf" \
            //scripts:perf_daemon_full //scripts:perf_clients_full //web:perf_usable_full //web:bundle_size
      - name: Make the run's record
        run: |
          scripts/perf-log.sh record "$RUNNER_TEMP/perf/metrics.jsonl" > "$RUNNER_TEMP/perf/record.jsonl"
          { echo '**perf log record**'; echo '```'; cat "$RUNNER_TEMP/perf/record.jsonl"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-record
          path: ${{ runner.temp }}/perf/record.jsonl
          retention-days: 1
      - if: always()
        run: bazelisk shutdown || true

  # The one job that writes: perf-log's record, appended to the log branch
  # with GITHUB_TOKEN, from a fresh checkout that runs nothing the sticky
  # disk built. A job of its own so that nothing perf-log ran (whose outputs
  # come from the disk) shares a runner or a workspace with the token.
  perf-log-publish:
    needs: perf-log
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions: { contents: write }
    # One run at a time appends; a later push waits rather than races.
    concurrency: { group: perf-log, cancel-in-progress: false }
    steps:
      # Its credentials stay for scripts/perf-log.sh publish's push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: perf-record, path: "${{ runner.temp }}/perf" }
      - name: Append the run to the perf log
        run: scripts/perf-log.sh publish "$RUNNER_TEMP/perf/record.jsonl"
