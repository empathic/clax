name: Publish Pi package

# Publishes plugins/pi to npm as @empathic/clax-pi, run by hand (Actions,
# Publish Pi package, Run workflow) on main once the plugins are pinned to
# the release that shares the package's version (docs/usage.md,
# "Releasing"). It refuses a package whose wrapper pins another release, a
# version npm already has, and a package that does not typecheck; the
# package's tests, which need a clax build, are CI's (scripts/run.sh
# pi-test), so run it on a commit CI passed. With `dry_run` it does
# everything but publish.
#
# It publishes through npm trusted publishing (OIDC, no token) with
# provenance, so the package on npmjs.com must name this repository and
# workflow as its trusted publisher. npm offers that only for a package that
# exists, so the first version is published by hand (`npm publish` in
# plugins/pi).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check and pack only; publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-pi
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @empathic/clax-pi
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: plugins/pi
    steps:
      - uses: actions/checkout@v4
      - name: Check the version and the pin
        shell: bash
        run: |
          set -euo pipefail
          ../../scripts/check-version.sh
          version="$(node -p 'require("./package.json").version')"
          pinned="$(sed -n 's/^PINNED_VERSION="\(.*\)"$/\1/p' scripts/ensure-clax.sh)"
          if [ "$pinned" != "$version" ]; then
            echo "plugins/pi/scripts/ensure-clax.sh pins $pinned, not $version: run this after the 'Pin the plugins to Clax $version' commit" >&2
            exit 1
          fi
          if npm view "@empathic/clax-pi@$version" version >/dev/null 2>&1; then
            echo "@empathic/clax-pi@$version is already on npm" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { package_json_file: plugins/pi/package.json }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: plugins/pi/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: Install npm 11
        run: npm install -g npm@11
      - name: Typecheck
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
      - name: Pack
        run: npm pack --dry-run
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish --provenance --access public
