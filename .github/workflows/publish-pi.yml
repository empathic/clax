name: Publish Pi package

# Publishes plugins/pi to npm as @empathic/clax-pi, run by hand (Actions,
# Publish Pi package, Run workflow) or by scripts/release.sh, once the
# plugins are pinned to the release that shares the package's version
# (docs/usage.md, "Releasing"). It publishes from the commit `sha` names
# (by default main's tip), which must be on main with CI passed on it: the
# package's tests, which need a clax build, are CI's (scripts/run.sh
# pi-test). It refuses a package whose wrapper pins another release, a
# version npm already has, and a package that does not typecheck. With
# `dry_run` it does everything but publish. The run is titled "Publish Pi
# package <sha>", or "Publish Pi package (dry run) <sha>", so a caller can
# find it.
#
# It publishes through npm trusted publishing (OIDC, no token) with
# provenance, so the package on npmjs.com must name this repository, this
# workflow and the environment `npm` as its trusted publisher. The job runs
# in that environment, whose deployment branches the repository's settings
# limit to main (Settings, Environments, npm, Deployment branches and tags:
# Selected, main), so npm refuses a token from a run dispatched on any
# other ref, whatever that ref's copy of this file checks. npm offers
# trusted publishing only for a package that exists, so the first version
# is not published here: scripts/release.sh publishes it from the
# releaser's machine (npm publish from a worktree of the pin commit) and
# prints that setup.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check and pack only; publish nothing"
        type: boolean
        default: true
      sha:
        description: "The commit to publish from: on main, with CI passed (default: main's tip)"
        type: string
        default: ""

run-name: >-
  ${{ inputs.dry_run && 'Publish Pi package (dry run)' || 'Publish Pi package' }}
  ${{ inputs.sha || github.sha }}

permissions:
  contents: read

concurrency:
  group: publish-pi
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @empathic/clax-pi
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    defaults:
      run:
        working-directory: plugins/pi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
      - name: Check the commit is on main and CI passed on it
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse --verify "$SHA^{commit}")"
          git fetch --quiet --no-tags origin main
          if ! git merge-base --is-ancestor "$sha" FETCH_HEAD; then
            echo "$sha is not on main" >&2
            exit 1
          fi
          # The gate is ci.yml's bazel job: the run's own conclusion also
          # counts perf-log, which is cancelled when pushes pile up.
          run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event push --commit "$sha" \
            --limit 1 --json databaseId --jq '.[0].databaseId // ""')"
          conclusion=""
          if [ -n "$run" ]; then
            conclusion="$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json jobs \
              --jq '.jobs[] | select(.name == "bazel") | .conclusion')"
          fi
          if [ "$conclusion" != success ]; then
            echo "CI's bazel job has not passed on $sha (${conclusion:-no run}): publish from a commit CI passed" >&2
            exit 1
          fi
      - name: Check the version and the pin
        shell: bash
        run: |
          set -euo pipefail
          ../../scripts/check-version.sh
          version="$(node -p 'require("./package.json").version')"
          pinned="$(sed -n 's/^PINNED_VERSION="\(.*\)"$/\1/p' scripts/ensure-clax.sh)"
          if [ "$pinned" != "$version" ]; then
            echo "plugins/pi/scripts/ensure-clax.sh pins $pinned, not $version: run this after the 'Pin the plugins to Clax $version' commit" >&2
            exit 1
          fi
          if npm view "@empathic/clax-pi@$version" version >/dev/null 2>&1; then
            echo "@empathic/clax-pi@$version is already on npm" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { package_json_file: plugins/pi/package.json }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: plugins/pi/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: Install npm 11
        run: npm install -g npm@11
      - name: Typecheck
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
      - name: Pack
        run: npm pack --dry-run
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish --provenance --access public
