name: Deploy prod

# Releases what a release pull request's staging tested, once it is merged
# into `prod` (docs/prod.md, "Releasing"): on every push to prod, and by
# hand (Actions, Deploy prod, Run workflow, on the branch prod), which runs
# it again for prod's tip. It builds nothing that ships:
#
#   candidate  the merge commit's second parent is the tested head
#              (scripts/find-candidate.sh: the merge brings in nothing else,
#              and staging.yml passed on that head); downloads that run's
#              release-dist and worker artifacts and checks every file's
#              attestation (scripts/verify-candidate.sh)
#   deploy     in the `production` environment, so once the owner
#              approves: deploys that Worker to clax.dev
#              (scripts/cloudflare-setup.sh --no-build, which refuses a
#              Worker built from another tree), waits for /healthz, checks a
#              site host and smokes it as an agent token. When clax.dev
#              already runs this commit (a run again), it uploads nothing
#              (--unless-live) and only checks and smokes what runs
#   publish    tags vX.Y.Z on the merge commit and makes the GitHub release
#              from the candidate's files, the ones staging's testers had,
#              as a draft: the repository's releases are immutable once
#              published, so every asset is on it first
#   fleet      the clax-fleet image of the tag: fleet-image.yml, run on it
#              (a tag made with a workflow's token starts no workflow),
#              which adds clax-fleet.yaml to the draft
#   release    publishes the draft, once it holds clax-fleet.yaml
#   carry      in the `release` environment, as the release App: the
#              release and the plugins' pin into main, merged once main's
#              CI passes (scripts/carry-release.sh), so the marketplaces
#              see the version and its pin in one push, after the release
#              exists
#   pi         once the carry is on main and CI passed on it: Publish Pi
#              package, from that commit
#   teardown   the staging instance, clax-pr-<N>: the reaper
#              (preview-reaper.yml), run on main, where the `staging`
#              environment admits it
#
# A failure fails the run, and GitHub notifies the owner; nothing is rolled
# back (docs/prod.md, "Rollback"). Run again, each job finds what it did
# done: the Worker running, the release drafted from the same tree, the
# tag's image built, the release published, the carry merged, the package on npm; so a run that failed
# after its upload is finished by running it again, and clax.dev is not
# deployed twice. A run by hand with `redeploy` uploads the Worker even so
# (to apply a changed variable, say). Beside the deploy, the reel job builds the landing page's reel
# from the same commit; the deploy puts it on Cloudflare Stream and points
# the Worker's REEL_URL at it (CLOUDFLARE_API_TOKEN needs Stream: Edit, and
# the account Stream). A reel that fails to build or upload never fails the
# deploy.
#
# Hourly, the drift check compares the tree of the commit /healthz reports
# with prod's tip's and fails when they differ. It deploys nothing and holds no deploy
# credential. GitHub runs scheduled workflows from the default branch's
# copy of this file.
on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      redeploy:
        description: Upload the Worker again even when clax.dev already runs prod's tip
        type: boolean
        default: false
  schedule:
    - cron: "17 * * * *"

permissions: {}

jobs:
  # No environment and no secret: what this merge ships, and that it is
  # what staging tested. Its outputs name the candidate for every job
  # after it; the verified files are this run's artifacts release-dist and
  # worker.
  candidate:
    if: ${{ github.event_name != 'schedule' && github.ref == 'refs/heads/prod' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read, actions: read, attestations: read, pull-requests: read }
    outputs:
      head: ${{ steps.find.outputs.head }}
      run: ${{ steps.find.outputs.run }}
      pr: ${{ steps.find.outputs.pr }}
      version: ${{ steps.find.outputs.version }}
    steps:
      # The merge commit and both its parents.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ github.sha }}", fetch-depth: 2, persist-credentials: false }
      - name: Find the candidate (scripts/find-candidate.sh)
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          scripts/find-candidate.sh "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"
          echo "version=$(scripts/check-version.sh --print)" | tee -a "$GITHUB_OUTPUT"
      - name: Download the candidate from staging's run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ steps.find.outputs.run }}
        run: |
          set -euo pipefail
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name release-dist --dir "$RUNNER_TEMP/candidate/release-dist"
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name worker --dir "$RUNNER_TEMP/candidate/worker"
      - name: Verify every file's attestation (scripts/verify-candidate.sh)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_COMMIT: ${{ steps.find.outputs.head }}
        run: scripts/verify-candidate.sh "$HEAD_COMMIT" "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: release-dist, path: "${{ runner.temp }}/candidate/release-dist/", if-no-files-found: error }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: worker, path: "${{ runner.temp }}/candidate/worker/worker.tar", if-no-files-found: error }

  # The landing page's reel (//web/reel:reel), built from this commit with
  # no secret and no environment, on a runner of CI's kind with a Bazel
  # state of its own, so a deploy re-records only the vignettes a change
  # touched. The deploy job puts it on Cloudflare Stream.
  reel:
    if: ${{ github.event_name != 'schedule' && github.ref == 'refs/heads/prod' }}
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ github.sha }}", persist-credentials: false }
      - uses: ./.github/actions/setup-bazel
        with:
          name: reel
          commit: true
      # Chromium's system libraries, as CI's bazel job installs them.
      - name: Install Chromium's system libraries
        run: bazelisk run //web:playwright -- install-deps chromium
      - name: Build the reel (bazelisk build //web/reel:reel)
        run: |
          set -euo pipefail
          bazelisk build //web/reel:reel
          mkdir -p "$RUNNER_TEMP/reel"
          cp bazel-bin/web/reel/reel.mp4 bazel-bin/web/reel/reel-poster.jpg "$RUNNER_TEMP/reel/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: reel, path: "${{ runner.temp }}/reel/", retention-days: 7, if-no-files-found: error }
      - name: Stop Bazel
        if: ${{ always() }}
        run: bazelisk shutdown || true

  deploy:
    # After the reel job, whatever its result: a reel that did not build
    # never holds up a deploy (the Stream step below falls back).
    needs: [candidate, reel]
    if: ${{ !cancelled() && needs.candidate.result == 'success' }}
    # GitHub's runner: the environment's secrets go to no third-party
    # runner. The tools are the ones scripts/cloudflare-setup.sh checks for.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Its branch policy admits prod only, and its required reviewer, the
    # owner, approves each deploy; its variables and secrets are what
    # scripts/setup-prod-github.sh sets and docs/prod.md describes.
    environment: production
    permissions: { contents: read }
    # One deploy at a time, and a running one is never cancelled. GitHub
    # keeps at most one waiting run per group, the newest, which is the tip.
    concurrency: { group: deploy-prod, cancel-in-progress: false }
    # The deploy's settings.
    env:
      PUBLIC_HOST: ${{ vars.PUBLIC_HOST }}
      SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
      STORE: ${{ vars.STORE }}
      RETIRED_CONTENT_ORIGIN: ${{ vars.RETIRED_CONTENT_ORIGIN }}
      # Secrets, not variables, kept out of the repository's settings and
      # masked in its logs: the GitHub OAuth App's client ID (GitHub refuses
      # a name starting GITHUB_), the owner's login and the Cloudflare
      # account's ID.
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      OWNER_GITHUB: ${{ secrets.OWNER_GITHUB }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # The merge commit, with the tested head (its second parent), whose
      # tree the deploy checks the Worker's against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false }

      # A run that waited behind another may hold a commit prod has moved
      # past: the run of the newer push deploys that one.
      - name: Check the commit is prod's tip
        run: |
          set -euo pipefail
          tip="$(git ls-remote origin refs/heads/prod | cut -f1)"
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_SHA is not prod's tip (${tip:-no prod}); only prod's tip is deployed"
            exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26 }
      # The tools scripts/cloudflare-setup.sh checks for, though it builds
      # nothing here.
      - name: Install Rust toolchain
        run: rustup toolchain install && rustup target add wasm32-unknown-unknown
      - name: Install clang, lld and llvm
        run: sudo apt-get update -q && sudo apt-get install -y -q clang lld llvm
      # wrangler and the deploy's own packages, before any secret is in the
      # environment.
      - name: Install the deploy's packages
        run: scripts/pnpm-install-stamped.sh crates/clax-worker

      # The verified candidate Worker: its build, built-from.json and the
      # web UI it embeds.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: worker, path: "${{ runner.temp }}" }
      - name: Unpack the Worker
        run: tar -xf "$RUNNER_TEMP/worker.tar"

      # The reel job's video, when it built one.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.reel.result == 'success' }}
        with: { name: reel, path: "${{ runner.temp }}/reel" }

      # The reel on Cloudflare Stream (scripts/reel-stream.mjs, which installs
      # nothing): uploaded unless Stream already has it, or, when the reel
      # job built none, the newest reel Stream has. Its addresses go to the
      # deploy below as --reel-url and --reel-poster-url; when this step
      # fails, the deploy goes on and the landing page shows no player.
      - name: Put the reel on Cloudflare Stream (scripts/reel-stream.mjs)
        id: reel
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REEL: ${{ runner.temp }}/reel/reel.mp4
        run: |
          set -euo pipefail
          if [ -f "$REEL" ]; then node scripts/reel-stream.mjs "$REEL"; else node scripts/reel-stream.mjs --latest; fi >> "$GITHUB_OUTPUT"

      # Deploys the candidate (--no-build installs and builds nothing, and
      # refuses a Worker built from another tree); only this step has the
      # secrets. --unless-live: when /healthz already reports this commit,
      # an earlier run uploaded it, and this one uploads nothing; it checks
      # and smokes what runs. A run by hand with `redeploy` uploads anyway.
      - name: Deploy (scripts/cloudflare-setup.sh --ci --production --no-build --unless-live --smoke)
        env:
          REDEPLOY: ${{ inputs.redeploy }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLAX_SMOKE_TOKEN: ${{ secrets.CLAX_SMOKE_TOKEN }}
          # The deploy record (setup secrets included on a first deploy)
          # stays in the runner's temporary directory, never uploaded.
          CLAX_DEPLOY_HOME: ${{ runner.temp }}/clax-deploy
          REEL_URL: ${{ steps.reel.outputs.reel_url }}
          REEL_POSTER_URL: ${{ steps.reel.outputs.reel_poster_url }}
        run: |
          set -euo pipefail
          args=(--legal bundled --public "$PUBLIC_HOST" --site-domain "$SITE_DOMAIN" --store "$STORE")
          if [ -n "$OAUTH_CLIENT_ID" ]; then
            args+=(--github-client-id "$OAUTH_CLIENT_ID" --owner-github "$OWNER_GITHUB")
          fi
          if [ -n "$RETIRED_CONTENT_ORIGIN" ]; then
            args+=(--retired-content-origin "$RETIRED_CONTENT_ORIGIN")
          fi
          if [ -n "$REEL_URL" ]; then
            args+=(--reel-url "$REEL_URL" --reel-poster-url "$REEL_POSTER_URL")
          else
            echo "::warning::no reel on Cloudflare Stream: the landing page shows no player (see the Stream step)"
          fi
          if [ "$REDEPLOY" != true ]; then args+=(--unless-live); fi
          scripts/cloudflare-setup.sh "${args[@]}" --account "$CLOUDFLARE_ACCOUNT_ID" \
            --ci --production --no-build --smoke --i-know-what-i-am-doing

      # The commit, the build and the Cloudflare version the record names
      # (`wrangler rollback <version ID>` returns to it), and what /healthz
      # answers now; only those two fields, since the record holds secrets.
      - name: Summary
        if: ${{ always() }}
        env:
          RECORD: ${{ runner.temp }}/clax-deploy/${{ vars.PUBLIC_HOST }}.json
          HEAD_COMMIT: ${{ needs.candidate.outputs.head }}
        run: |
          field() { node -e 'try { console.log(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))[process.argv[2]] ?? "") } catch { console.log("") }' "$RECORD" "$1"; }
          build="$(field build)"
          version="$(field version_id)"
          health="$(curl -fsS --max-time 20 "https://$PUBLIC_HOST/healthz" 2>&1 || true)"
          {
            echo "**Deploy of https://$PUBLIC_HOST**"
            echo
            echo "- commit: \`$GITHUB_SHA\` (built from the release branch's head \`$HEAD_COMMIT\`, the same tree)"
            echo "- build: \`${build:-none recorded}\`"
            echo "- Cloudflare version: \`${version:-none recorded}\`"
            echo "- /healthz:"
            echo
            echo '```'
            echo "$health"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The tag and the GitHub release, from the candidate's files. A release
  # of this version made from the merge commit's tree already is this one
  # (a run again); one from another tree fails the job.
  publish:
    needs: [candidate, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: write }
    env:
      VERSION: ${{ needs.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ github.sha }}", persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: release-dist, path: "${{ runner.temp }}/dist" }
      # A draft: a published release is immutable (the repository's
      # setting), and clax-fleet.yaml joins it only once the tag's image is
      # built (the fleet job), so the release job publishes it after that.
      # A draft makes no tag, and the fleet job runs on the tag, so the tag
      # is made here first.
      - name: Tag vX.Y.Z on the merge commit and draft its release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tree="$(git rev-parse 'HEAD^{tree}')"
          [ "$(cat "$RUNNER_TEMP/dist/SOURCE_TREE")" = "$tree" ] \
            || { echo "::error::the candidate's SOURCE_TREE is not the merge commit's tree $tree"; exit 1; }
          tagged="$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/tags/v$VERSION" | cut -f1)"
          if [ -z "$tagged" ]; then
            gh api "repos/$GH_REPO/git/refs" --method POST -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA" >/dev/null
          elif [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::the tag v$VERSION is on $tagged, not the merge commit $GITHUB_SHA"
            exit 1
          fi
          have="$(scripts/release-exists-check.sh --tree "v$VERSION")"
          if [ "$have" = "$tree" ]; then
            echo "v$VERSION has its release already, from this tree"
            exit 0
          fi
          [ -z "$have" ] || { echo "::error::v$VERSION is released already, from tree $have, not this one ($tree)"; exit 1; }
          gh release create "v$VERSION" "$RUNNER_TEMP"/dist/* \
            --draft --verify-tag --title "Clax $VERSION" --generate-notes

  # The clax-fleet image of the release's tag (fleet-image.yml, which also
  # adds clax-fleet.yaml to the draft release). The tag is made with this
  # workflow's token, which starts no workflow, so the run is started here,
  # on the tag, and waited for. A run of the tag that passed, or is still
  # running, is this one (a run again).
  fleet:
    needs: [candidate, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions: { contents: read, actions: write }
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.candidate.outputs.version }}
    steps:
      - name: Run fleet-image.yml on the tag
        run: |
          set -euo pipefail
          # The newest run of the tag that did not fail: "<ID> <status>".
          newest() {
            gh run list --workflow fleet-image.yml --branch "$TAG" --limit 20 \
              --json databaseId,status,conclusion \
              --jq '[.[] | select(.status != "completed" or .conclusion == "success")][0] // empty | "\(.databaseId) \(.status)"'
          }
          have="$(newest)"
          if [ -z "$have" ]; then
            gh workflow run fleet-image.yml --ref "$TAG"
            for _ in $(seq 30); do
              have="$(newest)"
              [ -n "$have" ] && break
              sleep 10
            done
            [ -n "$have" ] || { echo "::error::no fleet-image.yml run of $TAG started"; exit 1; }
          fi
          if [ "${have#* }" = completed ]; then
            echo "fleet-image.yml passed on $TAG already (run ${have% *})"
            exit 0
          fi
          gh run watch "${have% *}" --exit-status --interval 30

  # Publishes the draft, which GitHub then keeps as it is: the candidate's
  # files and clax-fleet.yaml. A release published already is this one (a
  # run again).
  release:
    needs: [candidate, publish, fleet]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: { contents: write }
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.candidate.outputs.version }}
    steps:
      - name: Publish the release
        run: |
          set -euo pipefail
          state="$(gh release view "$TAG" --json isDraft,assets --jq '"\(.isDraft) \([.assets[].name] | index("clax-fleet.yaml") != null)"')"
          if [ "${state% *}" = false ]; then
            echo "$TAG is published already"
            exit 0
          fi
          [ "${state#* }" = true ] || { echo "::error::the draft of $TAG has no clax-fleet.yaml: the fleet-image.yml run of $TAG adds it"; exit 1; }
          gh release edit "$TAG" --draft=false --latest

  # The release and its pin into main, as the release App: a workflow's own
  # token starts no CI on what it makes, and main takes a pull request
  # only once its CI passed.
  carry:
    needs: [candidate, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Its branch policy admits prod only; it holds the App's ID and key.
    environment: release
    permissions: { contents: read }
    outputs:
      commit: ${{ steps.carry.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Fetch main
        run: git fetch --quiet --no-tags origin main:refs/remotes/origin/main
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Carry the release to main (scripts/carry-release.sh)
        id: carry
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          set -euo pipefail
          scripts/carry-release.sh "$VERSION" "$GITHUB_SHA" | tee "$RUNNER_TEMP/carry.log"
          grep '^commit=' "$RUNNER_TEMP/carry.log" | tail -1 >> "$GITHUB_OUTPUT"

  # The Pi package, from the carry's commit on main once CI passed on it
  # (publish-pi.yml checks both; the `npm` environment admits main).
  pi:
    needs: [candidate, carry]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions: { contents: read, actions: write }
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.candidate.outputs.version }}
      COMMIT: ${{ needs.carry.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ github.sha }}", persist-credentials: false }
      - name: Wait for CI on main's commit (scripts/wait-ci.sh)
        run: scripts/wait-ci.sh "$COMMIT" push
      - name: Run Publish Pi package on it
        run: |
          set -euo pipefail
          if npm view "@empathic/clax-pi@$VERSION" version >/dev/null 2>&1; then
            echo "@empathic/clax-pi@$VERSION is on npm already"
            exit 0
          fi
          gh workflow run publish-pi.yml --ref main -f sha="$COMMIT" -f dry_run=false
          title="Publish Pi package $COMMIT"
          run=""
          for _ in $(seq 30); do
            run="$(gh run list --workflow publish-pi.yml --event workflow_dispatch --limit 20 \
              --json databaseId,displayTitle --jq "[.[] | select(.displayTitle == \"$title\")][0].databaseId // \"\"")"
            [ -n "$run" ] && break
            sleep 10
          done
          [ -n "$run" ] || { echo "::error::no run titled \"$title\" started"; exit 1; }
          gh run watch "$run" --exit-status --interval 30

  # The release pull request is merged, so closed: the reaper, on main,
  # tears its staging instance down with the staging environment's token.
  teardown:
    needs: [candidate, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: { actions: write }
    steps:
      - name: Run the reaper (preview-reaper.yml) on main
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.candidate.outputs.pr }}
        run: |
          gh workflow run preview-reaper.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "the reaper tears down clax-pr-$PR, staging of #$PR"

  drift:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # No environment: the production environment admits prod only, and this
    # job needs none of its secrets. The host is the repository variable
    # PUBLIC_HOST (scripts/setup-prod-github.sh sets it); without it the
    # check fails, naming the variable.
    permissions: { contents: read, actions: read }
    steps:
      - name: Compare /healthz's commit with prod's tip, and check its CLAX_KEK
        env:
          HOST: ${{ vars.PUBLIC_HOST }}
          GH_TOKEN: ${{ github.token }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          [ -n "$HOST" ] || { echo "::error::the repository variable PUBLIC_HOST is not set (scripts/setup-prod-github.sh sets it)"; exit 1; }
          tip="$(git ls-remote "$REPO_URL" refs/heads/prod | cut -f1)"
          [ -n "$tip" ] || { echo "::error::$REPO_URL has no branch prod"; exit 1; }
          health="$(curl -fsS --max-time 30 --retry 3 --retry-all-errors "https://$HOST/healthz")" \
            || { echo "::error::https://$HOST/healthz does not answer"; exit 1; }
          commit="$(python3 -c 'import json, sys; print(json.loads(sys.argv[1]).get("commit") or "")' "$health")"
          echo "prod's tip $tip; https://$HOST runs ${commit:-no commit}"
          # Every stored model key opens only under CLAX_KEK: an instance
          # that reports none has lost it.
          kek="$(python3 -c 'import json, sys; print(json.loads(sys.argv[1]).get("kek"))' "$health")"
          if [ "$kek" = False ]; then
            echo "::error::https://$HOST reports no CLAX_KEK: put it back from its backup (docs/prod.md, \"CLAX_KEK\")"
            exit 1
          fi
          # The Worker reports the commit it was built from, the release
          # branch's head, not the merge commit on prod; the two have one
          # tree. /healthz may name the commit in full or by a prefix of it.
          tip_tree="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tip" --jq .commit.tree.sha)"
          run_tree=""
          if [ "${#commit}" -ge 7 ]; then
            run_tree="$(gh api "repos/$GITHUB_REPOSITORY/commits/$commit" --jq .commit.tree.sha 2>/dev/null || true)"
          fi
          if [ -z "$run_tree" ] || [ "$run_tree" != "$tip_tree" ]; then
            # A deploy of the tip still running or waiting is not drift.
            pending="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-prod.yml --commit "$tip" \
              --json status --jq '[.[] | select(.status != "completed")] | length')"
            if [ "$pending" != 0 ]; then
              echo "::notice::a Deploy prod run of $tip has not finished; not drift yet"
              exit 0
            fi
            echo "::error::https://$HOST runs ${commit:-a build that names no commit}, not prod's tip $tip: see the latest Deploy prod run, or run it (docs/prod.md, \"Drift\")"
            exit 1
          fi
