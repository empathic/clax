[env]
# Bundled SQLite build flags. Without SQLITE_ENABLE_MEMORY_MANAGEMENT each
# connection keeps its own page cache; with it, every connection shares one
# cache behind a global mutex, which serialises the store's concurrent
# readers. MEMSTATUS=0 drops the global mutex around every allocation.
# `force` makes these win over a LIBSQLITE3_FLAGS already in the environment.
LIBSQLITE3_FLAGS = { value = "-USQLITE_ENABLE_MEMORY_MANAGEMENT -DSQLITE_DEFAULT_MEMSTATUS=0", force = true }
