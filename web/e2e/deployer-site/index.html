<!doctype html>
<html lang="en" data-instance="{{INSTANCE}}" data-queue="{{QUEUE}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leave requests</title>
  <style>
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #fafaf7; color: #1d1d1b; }
    main { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
    h1 { font-size: 24px; margin: 0 0 16px; }
    .request { background: #fff; border: 1px solid #ddd8cc; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .request h2 { font-size: 17px; margin: 0 0 4px; }
    .request p { margin: 0 0 12px; color: #5b5a55; }
    .approve { background: #2f6b3f; color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; font: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Leave requests</h1>
    <section class="request" id="req-1">
      <h2>Ines Moreau, 3 to 7 November</h2>
      <p>Four days of annual leave, approved by her lead.</p>
      <button type="button" class="approve">Approve</button>
    </section>
    <section class="request" id="req-2">
      <h2>Tomás Ruiz, 12 November</h2>
      <p>One day, for a medical appointment.</p>
      <button type="button" class="approve">Approve</button>
    </section>
  </main>
  <script src="{{INSTANCE}}/_clax/overlay.js"></script>
  <script src="/app.js"></script>
</body>
</html>
