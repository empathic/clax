<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start here: Clax in five minutes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 class="sr-only">Start here: Clax in five minutes</h1>
  <figure class="reel" id="reel" hidden>
    <figcaption class="reel-bar">
      <span class="reel-dots" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="reel-title">Clax in a minute</span>
      <button class="reel-hide" id="reel-hide" type="button" aria-label="Hide video" title="Hide video">Hide<span aria-hidden="true">✕</span></button>
    </figcaption>
    <video src="reel.mp4" poster="reel-poster.jpg" muted loop playsinline controls preload="metadata" aria-label="Clax in about a minute: people ask an agent for pages, it builds them, and they shape them together"></video>
  </figure>
  <button class="reel-show" id="reel-show" type="button" hidden><span class="play" aria-hidden="true"></span>Watch Clax in a minute</button>
  <nav class="tabs" aria-label="Sections">
    <a href="index.html" id="tab-start" aria-current="page">Quickstart</a>
    <a href="ideas.html" id="tab-ideas" hidden>Make it better<span class="count" id="idea-count"></span></a>
  </nav>
</header>

<main>
  <section id="view-start" aria-label="Quickstart">
    <div class="qs">
      <div>
        <div class="qs-head">
          <h2>Your first round trip</h2>
          <div class="progress">
            <div class="bar" role="progressbar" aria-label="Quickstart progress" aria-valuemin="0" aria-valuemax="8" aria-valuenow="0"><i id="bar"></i></div>
            <span id="progress-text">0 of 8 steps</span>
            <button class="linkbtn" id="reset" type="button">Start over</button>
          </div>
        </div>
        <div class="chart" id="chart">
          <svg class="edges" id="edges" aria-hidden="true"></svg>
        </div>
      </div>
      <aside class="panel" id="panel" aria-live="polite">
        <div class="ph">
          <div class="kicker" id="p-kicker"></div>
          <h2 id="p-title"></h2>
          <button class="close" id="p-close" type="button" aria-label="Close">✕</button>
        </div>
        <div class="pb" id="p-body"></div>
      </aside>
    </div>
  </section>

</main>

<div class="toast" id="toast" role="status" hidden></div>
<script src="ideas-data.js"></script>
<script>
(() => {
  "use strict";

  // ---------- The reel ----------
  // reel.mp4 is a build artifact published beside the page, not part of the
  // repository: the figure shows once the video loads, and nothing shows
  // where it is absent. It plays by itself unless the viewer asks for
  // reduced motion. A viewer who hides it keeps it hidden on later visits
  // (REEL_HIDDEN in localStorage, where storage works) and can bring it back.
  {
    const REEL_HIDDEN = "clax-quickstart-reel-hidden";
    const reel = document.getElementById("reel"), video = reel.querySelector("video");
    const show = document.getElementById("reel-show");
    let loaded = false, hidden = false;
    try { hidden = localStorage.getItem(REEL_HIDDEN) === "1"; } catch (_) {}
    const play = () => {
      let still = false;
      try { still = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (_) {}
      if (!still) Promise.resolve().then(() => video.play()).catch(() => {});
    };
    const draw = () => { reel.hidden = !loaded || hidden; show.hidden = !loaded || !hidden; };
    const keep = (h) => {
      hidden = h;
      try { if (h) localStorage.setItem(REEL_HIDDEN, "1"); else localStorage.removeItem(REEL_HIDDEN); } catch (_) {}
      draw();
    };
    video.addEventListener("loadedmetadata", () => { loaded = true; draw(); if (!hidden) play(); }, { once: true });
    document.getElementById("reel-hide").addEventListener("click", () => { try { video.pause(); } catch (_) {} keep(true); });
    show.addEventListener("click", () => { keep(false); play(); });
  }

  // ---------- Content ----------
  /** Colours the parts of one shell or slash command. The text is unchanged, so the
   * block's textContent, which Copy reads, is exactly the command. */
  function hl(line) {
    let prog = false, subs = 0;
    const span = (c, t) => `<span class="tk-${c}">${t}</span>`;
    return line.replace(/(&lt;.*?&gt;)|("[^"]*"|'[^']*')|(\S+)/g, (m, ph, q, w) => {
      if (ph) return span("ph", ph);
      if (q) return span("str", q);
      if (w === "|") { prog = false; subs = 0; return span("op", w); }
      const env = /^([A-Z_][A-Z0-9_]*=)(.*)$/.exec(w);
      if (env && !prog) return span("env", env[1]) + env[2];
      if (!prog) { prog = true; return span("prog", w); }
      const fl = /^(--?[A-Za-z][\w-]*)(=.*)?$/.exec(w);
      if (fl) { subs = 9; return span("flag", fl[1]) + (fl[2] || ""); }
      if (/^https?:\/\//.test(w)) { subs = 9; return span("url", w); }
      if (/@|^[\w.-]+\/[\w.-]+$/.test(w)) { subs = 9; return span("arg", w); }
      if (subs < 3 && /^[a-z][a-z-]*$/.test(w)) { subs++; return span("sub", w); }
      subs = 9;
      return w;
    });
  }
  /** One command in its own block with its own Copy. `plain` leaves a prompt in words uncoloured, `n` numbers a step, `note` is a caption that is not copied. */
  const cmd = (s, o = {}) => `<div class="cmd${o.n ? " numbered" : ""}">${o.n ? `<span class="cmd-n" aria-hidden="true">${o.n}</span>` : ""}<pre>${o.plain ? s : hl(s)}</pre><button type="button" data-copy>Copy</button>${o.note ? `<span class="cmd-note">${o.note}</span>` : ""}</div>`;
  /** Several commands, one block each; numbered when the order matters. */
  const cmds = (list, numbered) => list.map((c, i) => (Array.isArray(c) ? cmd(c[0], { note: c[1] }) : cmd(c, { n: numbered ? i + 1 : 0 }))).join("");
  // The shell capability: "Show me" rings one of Clax's own controls. It is
  // null on a Clax without the `shell` capability and for viewers who cannot
  // edit, and then the buttons stay hidden.
  let shell = null;
  const canCache = {};
  const SHOWME = {
    send: ["send", "Show me Send to agent"],
    change: ["versions", "Show me Versions"], fork: ["fork", "Show me Fork"],
  };
  const showOk = (name) => !!shell && (name === "send" || !!canCache[name]);
  function showMe(id) {
    const [name, label] = SHOWME[id];
    return `<span class="showme-row"><button type="button" class="btn showme" data-show="${name}"${showOk(name) ? "" : " hidden"}>${label}</button><span class="muted-note showme-hint" role="status" hidden></span></span>`;
  }
  /** The comment step's one button, a small copy of Clax's own Comment control: it rings the real one and turns comment mode on from the same click. */
  const commentButton = () => `<span class="showme-row"><button type="button" class="btn showme commentbtn" data-comment${shell ? "" : " hidden"}><span class="keycap" aria-hidden="true">C</span>Comment</button><span class="muted-note comment-or"${shell ? "" : " hidden"}>or press C</span><span class="muted-note showme-hint" role="status" hidden></span></span>`;
  /** Shows each "Show me" under `root` whose control is on screen now (Send always, with a hint when it is not). */
  async function syncShow(root) {
    if (!shell) return;
    for (const b of root.querySelectorAll("[data-show]")) {
      const name = b.dataset.show;
      try { canCache[name] = await shell.can(name); } catch (_) { canCache[name] = false; }
      b.hidden = !showOk(name);
    }
    root.querySelectorAll("[data-comment], .comment-or").forEach((b) => { b.hidden = false; });
  }
  async function shellClick(btn) {
    const hint = btn.parentElement.querySelector(".showme-hint");
    const say = (t) => { hint.textContent = t; hint.hidden = false; clearTimeout(hint._t); hint._t = setTimeout(() => { hint.hidden = true; }, 5000); };
    hint.hidden = true;
    let ok = false;
    try {
      if (btn.dataset.comment !== undefined) {
        // Both calls start inside the click, so comment mode has the viewer's gesture.
        const on = shell.commentMode(true), ring = shell.highlight("comment");
        ring.catch(() => {});
        ok = await on;
        say(ok ? "Comment mode is on. Press Escape to leave it." : "Comment mode did not turn on.");
        return;
      }
      ok = await shell.highlight(btn.dataset.show);
    } catch (_) { ok = false; if (btn.dataset.comment !== undefined) return say("Comment mode is not available here."); }
    if (!ok) say(btn.dataset.show === "send" ? "Open Threads first." : "Not on screen right now.");
  }
  const tip = (h, s) => `<div class="tip"><b>${h}</b>${s}</div>`;

  /** Whether this page is a hosted Clax's landing page (served bare at its
   * `/start/`, no Clax around it) rather than an artifact: its links then
   * name the Clax serving it and stay in this tab. */
  const LANDING = !window.claude && location.pathname.startsWith("/start/");
  const CLAXDEV = LANDING ? location.origin : "https://clax.dev";
  /** How a link to CLAXDEV opens: in this tab on the landing page, else in a new one. */
  const OUT = LANDING ? "" : ' target="_blank" rel="noopener"';

  const README_LOCAL = "https://github.com/empathic/clax#pi-grok-build-or-every-harness-at-once";
  // This page's artifact ID: the first label of its own <ID>.localhost site.
  const ARTIFACT = (/^([a-z0-9]{8,})\./.exec(location.hostname) || [])[1] || "this page";
  /** The page's name in prompts: its <title>, else its heading. */
  const PAGE_NAME = document.title.trim() || (document.querySelector("h1")?.textContent || "").trim() || "Start here";
  /** The origin of the Clax shell that frames this page, or null while unknown: the `shell` capability's
   * `address()` says it (see the boot below). The page cannot read it itself, since its site sends no
   * referrer, so it stays null for a viewer without `shell` (one who cannot edit) and in the Clax app. */
  let SHELL = null;

   * on a local Clax's `<ID>.localhost` site, from that host's port; else null. */

  /** Takes `address()`'s answer, `{origin, url}` or null; anything else is ignored. */
  function placed(a) {
    if (!a || typeof a.origin !== "string" || typeof a.url !== "string") return;
    SHELL = a.origin; PAGE_URL = a.url;
  }

    pi:     { color: "#4d9abf", mark: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800"> <path fill="#F09082" d="M165.29 165.29H517.36V400H400V282.65H165.29Z"/> <path fill="#4D9ABF" d="M165.29 282.65H282.65V400H400V517.36H282.65V634.72H165.29Z"/> <path fill="#F1BE58" d="M517.36 400H634.72V634.72H517.36Z"/> </svg>` },
    grok:   { color: "var(--fg)", mark: `<svg fill="currentColor" fill-rule="evenodd" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M9.27 15.29l7.978-5.897c.391-.29.95-.177 1.137.272.98 2.369.542 5.215-1.41 7.169-1.951 1.954-4.667 2.382-7.149 1.406l-2.711 1.257c3.889 2.661 8.611 2.003 11.562-.953 2.341-2.344 3.066-5.539 2.388-8.42l.006.007c-.983-4.232.242-5.924 2.75-9.383.06-.082.12-.164.179-.248l-3.301 3.305v-.01L9.267 15.292M7.623 16.723c-2.792-2.67-2.31-6.801.071-9.184 1.761-1.763 4.647-2.483 7.166-1.425l2.705-1.25a7.808 7.808 0 00-1.829-1A8.975 8.975 0 005.984 5.83c-2.533 2.536-3.33 6.436-1.962 9.764 1.022 2.487-.653 4.246-2.34 6.022-.599.63-1.199 1.259-1.682 1.925l7.62-6.815"></path></svg>` },

  };

  const AGENTS = {
    claude: { label: "Claude Code", sub: "An agent token and one command" },
    codex:  { label: "Codex", sub: "An agent token and a few lines of config" },
    grok:   { label: "Grok Build", sub: "An agent token and one command" },
    pi:     { label: "Pi", sub: "With a Clax on your machine" },
    all:    { label: "All local agents / CLI", sub: "Running Clax yourself" },
  };

  const NODES = {
    signin: { kind: "terminal", kicker: "Start", title: "Sign in to clax.dev", sub: "Your account, with GitHub",
      cta: `<a class="gh" href="${CLAXDEV}/auth/github"${OUT}>${GH}Sign in with GitHub</a>`,
      body: `<p>Start with your clax.dev account. It's where your pages get public links, where you share them, and where comments come back from.</p>
        <a class="gh wide" href="${CLAXDEV}/auth/github"${OUT}>${GH}Sign in with GitHub</a>
        <p class="muted-note">Sign-in opens in a new tab; this one stays here. Come back when you're done.</p>

      body: `<p>On clax.dev, Claude Code, Codex and Grok Build connect with an agent token from your People page. Pi works with a Clax on your own machine. Pick yours:</p>` },

    data: { kind: "small", kicker: "Next", title: "Pages that do more", sub: "Data, live rooms, questions", starter: "Add a shared to-do list to this page.",
      body: `<p>Pages can do more than display. Ask your agent for:</p>
        <ul><li><b>Shared data</b>: a tracker or a sign-up sheet that keeps what people enter.</li><li><b>Live updates</b> while others view the page.</li><li><b>Questions</b> the agent asks you and you answer in the browser.</li>        <li><b>A tour of Clax</b> that points at its own buttons, as this page does.</li></ul>
        <p class="muted-note">A page declares what it uses in <code>clax.json</code>. One that uses more than the basics (the network, Claude, the shell) asks its owner once per artifact, and again when a version asks for more, in a bar in Clax.</p>
        ${tip("Try", `"Turn this into a checklist my team can tick off."`)}` },
  };

  // The last step, below Where next?: bringing someone in. Its panel holds the clax.dev way.
  NODES.done = { kind: "terminal", kicker: "Next", title: "Clax is fun with friends", sub: "Anyone you want to collaborate with?",
    cta: `<button type="button" class="btn invite" data-go="done">Invite someone →</button>`, starter: "Help me share this page with a teammate so they can comment on it.",
    body: `<p>Clax pages are better with two people pointing at them. Bring a teammate in to comment on your page; their agents can pick up threads too.</p>
      <ol><li>Open your page on clax.dev and press <b>Share</b>.</li><li>Add people by GitHub login as Can view, Can comment or Can edit, or copy the link.</li><li>Comments they leave come back to your page, and your agent answers them.</li></ol>` };

  const LAYOUT = [
    ["signin"], ["@split"], ["@loop"], ["next"],
    ["fork", "ask", "data"], ["done"],
  ];
  const INSTALLS = Object.keys(AGENTS).map((k) => `install-${k}`);
  const BRANCHES = ["fork", "ask", "data"];
  const EDGES = [
    ["signin", "install"], ["signin", "claxbot"], ["install", "attach"], ["attach", "comment"], ["claxbot", "comment"],
    ["change", "next"],

  // Two routes after sign-in: bring your own agent (install, then attach), or

  const claxbotRoute = () => state.have === "claxbot";
  const core = () => claxbotRoute()

  /** The number a step wears on this route: its place in the route, or null off it. */
  const numOf = (id) => { const i = core().indexOf(id.startsWith("install") ? "install" : id); return i < 0 ? null : i + 1; };

  const SEED = window.CLAX_IDEAS_SEED || [];

  // ---------- Storage ----------
  let db = null, user = null, uid = null;
  const state = { have: null, agent: null, done: {} };
  const LS = "clax-quickstart";
  try { const s = JSON.parse(localStorage.getItem(LS) || "null"); if (s) Object.assign(state, s); } catch (_) {}

    || (INSTALLS.includes(id) && state.agent && NODES[id].agent !== state.agent);
  const ideasFor = (id) => ideas.filter((i) => i.step === (id.startsWith("install") ? "install" : id));
  /** Stages that mean the idea is built: the step no longer waits on it. */
  const DONE_STATUS = new Set(["implemented", "shipped"]);

  /** The fork after sign-in: bring your own agent (install, then attach)
   * on the left, ClaxBot on the right. Both rejoin at the core loop. */
  function buildSplit(row) {
    row.classList.add("split");

    top.appendChild(b);
    const at = document.createElement("div"); at.className = "row";
    const ab = makeBox("attach");
    ab.classList.add("install-box");

    right.appendChild(makeBox("claxbot"));
    row.append(left, right);
  }

  /** The ✓ that marks a step done, sitting on the edge of its box. */
  const keyOf = (id) => (id.startsWith("install") ? "install" : id);
  const fab = (id) => `<button type="button" class="fab" data-toggle="${keyOf(id)}" title="Mark done" aria-label="Mark “${NODES[id].title}” done" aria-pressed="false">✓</button>`;
  /** Marks step `key` (the box `from`) done or not done; marking it done moves on to the next step and its focus. */
  function toggleDone(key, from = key) {
    const doneNow = !state.done[key];
    if (doneNow) state.done[key] = true; else delete state.done[key];

  }
  /** Puts keyboard focus on step `id`'s box. */

  /** A box: a focusable element that selects its step, and may hold a link or button of its own. */

  // The core loop: comment, send and change on a ring, arrows going round.
  const RING = ["comment", "send", "change"];
  let ring = null;
  function buildRing(row) {
    row.classList.add("ring-row");
    ring = document.createElement("div");
    ring.className = "ring";
    ring.innerHTML = `<svg class="ring-svg" aria-hidden="true"></svg>
      <div class="ring-hub"><span class="ring-spin">↻</span><b>The core loop</b><span>Comment, send, change. Repeat.</span></div>`;
    RING.forEach((id, i) => {

      b.innerHTML = `<span class="n"><span>${numOf(id) ?? ""}</span></span><span class="t">${n.title}</span><span class="s">${n.sub || ""}</span>${fab(id)}`;

  function drawRing() {

    const P = RING.map((id) => c(els[id]));

    const allDone = RING.every((id) => isDone(id));
    let out = `<defs><marker id="rm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z"/></marker></defs>

    const inside = (p, [x, y], pad) => x >= p.l - pad && x <= p.r + pad && y >= p.t - pad && y <= p.b + pad;
    const leave = (p, t, dir, pad) => { let s = t; for (let i = 0; i < 2000 && inside(p, at(s), pad); i++) s += dir * 0.002; return s; };
    for (let i = 0; i < 3; i++) {

      const s0 = leave(a, t0, 1, 1), s1 = leave(z, t1, -1, 3);
      if (s1 <= s0) continue;
      const [x0, y0] = at(s0), [x1, y1] = at(s1);
      const large = s1 - s0 > Math.PI ? 1 : 0;
      out += `<path class="ring-arc${allDone || isDone(RING[i]) || (i < 2 && isDone(RING[i + 1])) ? " done" : ""}" marker-end="url(#rm)" d="M${x0},${y0} A${rx},${ry} 0 ${large} 1 ${x1},${y1}"/>`;
    }
    ring.querySelector(".ring-svg").innerHTML = out;
  }

  function makeBox(id) {
      const n = NODES[id];
      const b = box(id);
      if (n.kind === "decision") {
        b.className = "decision";
        b.innerHTML = `<span>${n.title}</span>`;
      } else {
        const label = id === "done" ? "★" : numOf(id) ?? "";
        b.className = "node" + (n.kind === "small" ? " small" : "") + (INSTALLS.includes(id) ? " inst" : "") + (n.kind === "terminal" ? " terminal" : "");

  }

  function buildChart() {

      const r = document.createElement("div");
      r.className = "row";

      if (row[0] === "@split") { buildSplit(r); chart.appendChild(r); return; }
      if (row.length > 4) r.classList.add("branches");

    c.id = "celebrate"; c.className = "celebrate"; c.hidden = true; c.setAttribute("role", "status");

    els.next.parentElement.appendChild(c);
  }

  // The first round trip: a line above "Where next?" the moment the core route
  // completes in this visit. A route already complete on load is not celebrated.
  let wasComplete = null;
  function celebrate(complete) {

      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) { el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
    }
    if (!complete && el) el.hidden = true;
    wasComplete = complete;
  }
  function refreshNodes() {

      el.classList.toggle("done", isDone(id) && !NODES[id].kind?.startsWith("dec"));
      el.classList.toggle("dim", nodeDim(id));
      el.classList.toggle("sel", id === selected);
      const num = el.querySelector(":scope > .n > span");
      if (num && id !== "done") num.textContent = numOf(id) ?? "";
      el.querySelectorAll(":scope > .fab").forEach((f) => { const on = !!state.done[f.dataset.toggle]; f.classList.toggle("on", on); f.setAttribute("aria-pressed", String(on)); f.classList.toggle("beckon", f.dataset.toggle === "signin" && !Object.keys(state.done).length); });

    document.querySelector(".bar").setAttribute("aria-valuemax", String(CORE.length));
    document.querySelector(".bar").setAttribute("aria-valuenow", String(n));
    document.getElementById("progress-text").textContent = n === CORE.length ? "Done — keep going" : `${n} of ${CORE.length} steps`;
    celebrate(n === CORE.length);

  }

  /** Right-angled connectors. One box splitting into several draws one
   * trunk to a bar and a drop into each; several joining into one draw a
   * drop from each to a bar and one trunk down. */
  /** The box before `id` on the person's route: the one whose connector into it turns green when `id` is checked. */
  function prevOf(id) {
    if (id === "next") return "change";
    if (BRANCHES.includes(id)) return "next";
    const c = core(), i = c.indexOf(id);
    return i > 0 ? c[i - 1] : null;
  }
  let pulse = null; // {a, b}: the edge to draw on at the next redraw
  function drawEdges() {
    const box = chart.getBoundingClientRect();
    const pt = (id) => { const r = els[id].getBoundingClientRect(); return { x: r.left - box.left + r.width / 2, top: r.top - box.top, bot: r.bottom - box.top }; };
    const out = [`<defs>
      <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z"/></marker>
      <marker id="md" class="m-done" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z"/></marker></defs>`];
    // `delay` (seconds) draws the line on, for the path a just-noticed sign-in turns green.
    const line = (pts, cls, arrow, delay) => out.push(`<path class="e${cls}${delay === undefined ? "" : " draw"}"${delay === undefined ? "" : ` pathLength="1" style="animation-delay:${delay}s"`}${arrow ? ` marker-end="url(#${cls.includes("done") ? "md" : "m"})"` : ""} d="M${pts.map((p) => p.join(",")).join(" L")}"/>`);
    // An edge is green on the way out of a done box, and on the way into one from
    // the box before it on this route; it is dimmed when either end is off the route.
    const prev = prevOf;
    const onpath = (a, b) => !nodeDim(a) && !nodeDim(b) && (isDone(a) || (isDone(b) && prev(b) === a));
    const cls = (a, b) => (onpath(a, b) ? " done" : "") + (nodeDim(a) || nodeDim(b) ? " dim" : "");
    // Which side of the trunk at `x0` a box at `x` hangs on.
    const side = (x, x0) => (x < x0 - 1 ? "L" : x > x0 + 1 ? "R" : "C");
    /** A bus bar as two pieces either side of its trunk, each coloured by the edges that use it. */
    const bar = (x0, y, xs, green, dimmed, delayOf = () => undefined) => {
      for (const sd of ["L", "R"]) {
        const on = xs.filter((x) => side(x, x0) === sd);
        if (!on.length) continue;
        const end = sd === "L" ? Math.min(...on) : Math.max(...on);

      }
    };
    const from = {}, to = {};
    for (const [a, b] of EDGES) { (from[a] ||= []).push(b); (to[b] ||= []).push(a); }
    const drawn = new Set();

      if (from[a].length < 2) continue;

      const bus = A.bot + (Math.min(...T.map(([, B]) => B.top)) - A.bot) / 2;
      line([[A.x, A.bot], [A.x, bus]], (T.some(([b]) => onpath(a, b)) ? " done" : "") + (nodeDim(a) ? " dim" : ""), false, pulse && pulse.a === a ? 0 : undefined);
      bar(A.x, bus, T.map(([, B]) => B.x), (sd) => T.some(([b, B]) => side(B.x, A.x) === sd && onpath(a, b)), (sd) => T.filter(([, B]) => side(B.x, A.x) === sd).every(([b]) => nodeDim(a) || nodeDim(b)), (sd) => (pulse && pulse.a === a && side(pt(pulse.b).x, A.x) === sd ? 0.15 : undefined));
      for (const [b, B] of T) { line([[B.x, bus], [B.x, B.top - 2]], cls(a, b), true, pulse && pulse.a === a && pulse.b === b ? 0.3 : undefined); drawn.add(a + ">" + b); }

      const anyDone = S.some((a) => onpath(a, b));
      bar(B.x, bus, P.map(([, A]) => A.x), (sd) => P.some(([a, A]) => side(A.x, B.x) === sd && onpath(a, b)), () => false);
      line([[B.x, bus], [B.x, B.top - 2]], anyDone ? " done" : "", true);
    }
    // The rest: straight down, or down, across and down.
    for (const [a, b] of EDGES) {
      if (drawn.has(a + ">" + b)) continue;
      const A = pt(a), B = pt(b);
      if (Math.abs(A.x - B.x) < 2) line([[A.x, A.bot], [A.x, B.top - 2]], cls(a, b), true);
      else { const mid = A.bot + (B.top - A.bot) / 2; line([[A.x, A.bot], [A.x, mid], [B.x, mid], [B.x, B.top - 2]], cls(a, b), true); }
    }
    svg.innerHTML = out.join("");
    drawRing();
  }


  // ---------- Panel ----------
  const panel = document.getElementById("panel");
  function select(id, opts = {}) {
    selected = id;
    const n = NODES[id];
    document.getElementById("p-kicker").textContent = n.kicker;
    document.getElementById("p-title").textContent = n.kind === "small" && n.agent ? `Install for ${n.title}` : n.title;
    let html = n.body;
    if (id === "agent" || id === "install") {
      html += `<div class="choices">${Object.entries(AGENTS).map(([k, a]) => `<button type="button" data-agent="${k}" class="brandchoice${state.agent === k ? " on" : ""}" style="--brand:${BRAND[k].color}"><span class="mark">${BRAND[k].mark}</span><span><b>${a.label}</b><span>${a.sub}</span></span></button>`).join("")}</div><p class="muted-note">Already connected? <button type="button" class="linkbtn" data-go="attach" data-skip>Skip to Attach</button></p>`;
    }
    if (id === "next") {
      html += `<div class="choices">${BRANCHES.map((b) => `<button type="button" data-go="${b}"><b>${NODES[b].title}</b><span>${NODES[b].sub}</span></button>`).join("")}</div>`;
      html += `<p class="muted-note">Running Clax on your own machine, or hosting it yourself? That has its own guide in the <a href="https://github.com/empathic/clax#readme" target="_blank" rel="noopener">README</a>.</p>`;
    }
    if (n.starter) html = `<h3>Try this</h3><p>Paste it to your agent, or send it to ClaxBot:</p>${cmd(n.starter, { plain: true })}` + html;
    if (id === "comment") html += `<div class="showme-wrap">${commentButton()}</div>`;
    else if (SHOWME[id]) html += `<div class="showme-wrap">${showMe(id)}</div>`;
    const here = ideasFor(id);
    if (here.length) {
      const rank = { building: 0, planned: 1, proposed: 2, implemented: 3, shipped: 4 };
      const shown = here.filter((i) => i.status !== "declined").sort((a, b) => (rank[a.status || "proposed"] ?? 9) - (rank[b.status || "proposed"] ?? 9));
      const open = shown.filter((i) => !DONE_STATUS.has(i.status || "proposed")).length;
      if (shown.length) html += `<div class="ideas-here"><b>💡 ${open ? "This step could be better" : "Made better"}</b><ul>${shown.map((i) => { const st = i.status || "proposed"; return `<li class="${DONE_STATUS.has(st) ? "made" : ""}"><a href="ideas.html#${encodeURIComponent(i.id)}">${esc(i.title)}</a> <span class="tag st st-${esc(st)}">${esc(st)}</span></li>`; }).join("")}</ul></div>`;
    }
    const nx = nextOf(id);
    let actions = "";
    if (nx) actions += `<button type="button" class="btn" data-go="${nx}">Next: ${NODES[nx].title} →</button>`;
    if (actions) html += `<div class="actions">${actions}</div>`;
    document.getElementById("p-body").innerHTML = html;
    syncShow(panel); syncShow(chart);
    panel.querySelector(".pb").scrollTop = 0;
    panel.scrollTop = 0;
    if (!opts.quiet) panel.classList.add("open");
    refreshNodes();
    // An install-<agent> panel has no box of its own: only a step with one is scrolled to.
    if (!opts.quiet && els[id] && matchMedia("(min-width: 901px)").matches) {
      const r = els[id].getBoundingClientRect();
      if (r.top < 0 || r.bottom > innerHeight) els[id].scrollIntoView({ block: "center", behavior: "smooth" });
    }
  }
  function nextOf(id) {
    if (BRANCHES.includes(id)) return "done";
    if (id === "install" || id === "agent") return state.agent ? `install-${state.agent}` : null;
    if (id.startsWith("install-")) return "attach";
    const c = [...core(), "next"], i = c.indexOf(id);
    return i < 0 || i === c.length - 1 ? null : c[i + 1];
  }


  panel.addEventListener("click", (e) => {
    const t = e.target.closest("button, a");
    if (!t) return;
    if (t.dataset.copy !== undefined) return copy(t);
    if (t.dataset.show !== undefined || t.dataset.comment !== undefined) return shellClick(t);
    if (t.dataset.skip) { skipInstall(); return select("attach"); }
    if (t.dataset.agent) { state.agent = t.dataset.agent; state.have = "new"; save(); return select(`install-${state.agent}`); }
    if (t.dataset.done) {
      state.done[t.dataset.done] = true; save();
      const nx = nextOf(selected);
      return nx ? select(nx) : select(selected);
    }
    if (t.dataset.undone) { delete state.done[t.dataset.undone]; save(); return select(selected); }
    if (t.dataset.go) return select(t.dataset.go);
  });
  document.getElementById("p-close").addEventListener("click", () => panel.classList.remove("open"));
  document.getElementById("reset").addEventListener("click", () => { state.have = null; state.agent = null; state.done = {}; save(); select("signin"); });

  /** "Already installed": the bring-your-own route with the install done. */
  function skipInstall() { state.have = "existing"; state.done.install = true; save(); }

  // Clicking a route's box chooses that route; an unchosen install box switches the agent.
  chart.addEventListener("click", (e) => {
    const b = e.target.closest("[data-id]");
    if (e.target.closest("[data-skip]")) skipInstall();
    if (b && b.dataset.id === "claxbot" && !e.target.closest("a, button")) { state.have = "claxbot"; save(); refreshNodes(); }
    if (b && b.dataset.id === "install" && claxbotRoute() && !e.target.closest("a, button")) { state.have = "new"; save(); refreshNodes(); }
    const pick = e.target.closest("[data-pick]");
    if (pick) { state.agent = pick.dataset.pick; state.have = "new"; save(); refreshNodes(); }
    if (b && INSTALLS.includes(b.dataset.id) && !e.target.closest("a, button")) { state.agent = NODES[b.dataset.id].agent; state.have = "new"; save(); refreshNodes(); }
  }, true);

  async function copy(btn) {
    const text = btn.parentElement.querySelector("pre").textContent;
    try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; }
    catch (_) {
      const r = document.createRange(); r.selectNodeContents(btn.parentElement.querySelector("pre"));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "Selected";
    }
    setTimeout(() => (btn.textContent = "Copy"), 1400);
  }

  // ---------- Noticing a sign-in ----------
  // On clax.dev a viewer who is a signed-in person has done step 1. The page
  // itself runs on its own site's domain, so clax.dev is known from the
  // shell's origin ({@link SHELL}), as the shell itself says it. A local
  // Clax cannot say whether it is linked to clax.dev, so it never decides.
  const hosted = () => { try { return !!SHELL && /(^|\.)clax\.dev$/.test(new URL(SHELL).hostname); } catch (_) { return false; } };
  const toast = document.getElementById("toast");
  function say(text) {
    toast.textContent = text; toast.hidden = false;
    clearTimeout(say.t); say.t = setTimeout(() => { toast.hidden = true; }, 4500);
  }
  async function noticeSignIn() {
    if (!hosted() || !user || state.done.signin) return;
    try {
      const m = await user.me();
      if (!m || !m.id) return;
      const mine = ((await user.profiles(m.id)) || {})[m.id];
      if (!mine || mine.guest !== false) return;
      if (state.done.signin) return;
      const nx = nextOf("signin"), reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      state.done.signin = true; save();
      // Redraws in the next moments (a resize, a refresh) keep the draw-on rather than snapping it off.
      if (!reduce && nx) { pulse = { a: "signin", b: nx }; setTimeout(() => { pulse = null; }, 900); }
      select(nx || "signin", { quiet: true });
      if (nx) focusStep(nx);
      const fab = els.signin && els.signin.querySelector(".fab");
      if (fab && !reduce) { fab.classList.add("pop"); fab.addEventListener("animationend", () => fab.classList.remove("pop"), { once: true }); }
      say(`Signed in as ${mine.name || m.name || "you"} — on to step ${numOf(nx) ?? 2}`);
    } catch (_) {}
  }

  // ---------- Ideas ----------
  // The full list is ideas.html; this page shows which steps have some.
  let ideas = SEED.slice();
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  // The shipped copy has no tabs and no ideas page (web/scripts/build-quickstart.mjs
  // drops both), so it neither loads ideas nor links to them.
  const IDEAS_PAGE = !!document.getElementById("tab-ideas");
  const countIdeas = () => {
    if (!IDEAS_PAGE) return;
    // The tab is for a page that has ideas.
    document.getElementById("tab-ideas").hidden = !ideas.length;
    document.getElementById("idea-count").textContent = String(ideas.filter((i) => i.status !== "shipped" && i.status !== "declined").length);
  };

  // ---------- Deep links ----------
  // index.html#<step> opens that step (ideas.html links here so).
  function route() {
    const id = decodeURIComponent(location.hash.slice(1)).replace(/^start\//, "");
    // Links from the ideas page and older links name steps this chart has folded together.
    const to = NODES[id] ? id : { invite: "done", share: "done", devserver: "next", link: "attach", have: "install" }[id];
    if (to) select(to);
    requestAnimationFrame(drawEdges);
  }
  addEventListener("hashchange", route);

  // ---------- Boot ----------
  buildChart();
  // Open on the first step not done yet, along the reader's own path.
  const path = () => core().map((k) => (k !== "install" ? k : state.agent ? `install-${state.agent}` : "install"));
  const first = path().find((k) => !isDone(k)) || "next";
  select(first, { quiet: true });
  route();
  new ResizeObserver(() => drawEdges()).observe(chart);
  countIdeas();

  (async () => {
    const c = window.claude;
    if (!c || typeof c.use !== "function") return;
    try { user = await c.use("user"); } catch (_) {}
    try { db = await c.use("db"); } catch (_) {}
    try { shell = (await c.use("shell")) || null; } catch (_) { shell = null; }
    if (shell) {
      syncShow(panel); syncShow(chart);
      try { placed(await shell.address()); } catch (_) {}
      // The open panel names PAGE_URL: draw it again with the shell's answer, keeping its scroll.
      if (selected === "attach") { const pb = panel.querySelector(".pb"), top = pb.scrollTop; select(selected, { quiet: true }); pb.scrollTop = top; }
    }
    try { uid = user ? await user.id() : null; } catch (_) {}
    if (!db) { await noticeSignIn(); return; }
    if (uid) {
      try {
        const snap = await db.doc(`data/users/${uid}/progress`).get();
        if (snap.exists) { const d = snap.data(); state.agent = d.agent ?? state.agent; state.have = d.have ?? state.have; state.done = Object.assign({}, state.done, d.done || {}); knownAgent(); normalize(); wasComplete = null; }
        else save();
      } catch (_) {}
      refreshNodes();
    }
    noticeSignIn();
    if (IDEAS_PAGE) db.collection("extensions").onSnapshot((snap) => {
      const list = snap.docs.map((d) => Object.assign({ id: d.id || (d.ref && d.ref.id) }, d.data())).filter((i) => i.title);
      if (list.length) ideas = list;
      // The open panel lists its step's ideas: draw it again from the loaded list, keeping its scroll.
      if (selected) { const pb = panel.querySelector(".pb"), top = pb.scrollTop; select(selected, { quiet: true }); pb.scrollTop = top; }
      refreshNodes();
      countIdeas();
    }, () => {});
  })();
})();
</script>
</body>
</html>
