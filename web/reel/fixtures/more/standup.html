<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northwind Standup</title>
<style>
  /* Northwind's standup board: a seeded page for the reel's "Pages that do
     more" vignette (web/reel/vignettes/more.ts). Updates and votes live in
     the page's shared database (db); the signups chart is fetched through
     the daemon (net) from a host the owner approves. Northwind, its people
     and its numbers are invented. Light only, as the reel is filmed. */
  :root {
    --bg: #f6f5f1;
    --card: #ffffff;
    --fg: #1c1b19;
    --muted: #6d6a63;
    --faint: #a19d94;
    --line: #e6e2d9;
    --accent: #2f62d0;
    --accent-soft: #e7eefc;
    --up: #2b8a3e;
    --bar: #c9d6f2;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 32px 28px 40px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
  header p { margin: 0 0 2px; color: var(--muted); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; }
  h1 { margin: 0; font-size: 30px; letter-spacing: -0.01em; }
  .tally { color: var(--muted); font-size: 14px; }
  .tally b { color: var(--fg); }
  .grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .card h2 { margin: 0; padding: 14px 18px 10px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: baseline; }
  .card h2 span { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--faint); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 12px; padding: 11px 18px; border-top: 1px solid var(--line); }
  li.fresh { animation: arrive 900ms cubic-bezier(0.2, 0.8, 0.2, 1); }
  @keyframes arrive { from { background: #fff4d6; transform: translateY(-6px); opacity: 0; } 30% { opacity: 1; transform: none; background: #fff4d6; } to { background: transparent; } }
  .av { flex: none; width: 30px; height: 30px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 600; }
  .body { flex: 1; min-width: 0; }
  .text { display: block; }
  .by { display: block; color: var(--muted); font-size: 12.5px; }
  .vote { flex: none; display: inline-flex; align-items: center; gap: 6px; min-width: 58px; justify-content: center; border: 1px solid var(--line); background: #fbfaf7; color: var(--fg); border-radius: 999px; padding: 4px 10px; font: 600 13px/1.2 inherit; cursor: pointer; }
  .vote svg { width: 10px; height: 10px; fill: var(--faint); }
  .vote.mine { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .vote.mine svg { fill: var(--accent); }
  .vote .n { display: inline-block; min-width: 1ch; }
  .vote.bump .n { animation: bump 420ms cubic-bezier(0.2, 0.8, 0.2, 1); }
  @keyframes bump { 40% { transform: scale(1.45); color: var(--up); } }
  .voters { display: flex; margin-left: 2px; }
  .voters i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--card); margin-left: -5px; font-style: normal; font-size: 8px; color: #fff; display: grid; place-items: center; }
  form { display: flex; gap: 8px; padding: 12px 18px 14px; border-top: 1px solid var(--line); background: #fbfaf7; }
  form input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; background: #fff; }
  form button { border: 0; border-radius: 8px; background: var(--fg); color: #fff; padding: 8px 14px; font: 600 14px/1.2 inherit; cursor: pointer; }
  .loading { color: var(--muted); }
  /* The signups chart. */
  .kpi { display: flex; align-items: baseline; gap: 10px; padding: 2px 18px 6px; min-height: 46px; }
  .kpi b { font-size: 30px; letter-spacing: -0.02em; }
  .kpi .delta { color: var(--up); font-weight: 600; font-size: 14px; }
  .kpi .note { color: var(--muted); font-size: 13px; }
  .chart { position: relative; height: 270px; margin: 0 18px 8px; }
  .chart svg { width: 100%; height: 100%; overflow: visible; }
  .chart .gl { stroke: var(--line); stroke-width: 1; }
  .chart .ax { fill: var(--faint); font-size: 11.5px; }
  .chart rect.b { fill: var(--bar); transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); transition: transform 700ms cubic-bezier(0.2, 0.8, 0.2, 1); }
  .chart rect.b.last { fill: var(--accent); }
  .chart.grown rect.b { transform: scaleY(1); }
  .chart .lbl { fill: var(--accent); font-size: 13px; font-weight: 700; opacity: 0; transition: opacity 300ms 700ms; }
  .chart.grown .lbl { opacity: 1; }
  .wait { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 6px; color: var(--muted); border: 1.5px dashed var(--line); border-radius: 12px; background: repeating-linear-gradient(135deg, #fbfaf7 0 10px, #f6f4ef 10px 20px); }
  .wait b { color: var(--fg); font-size: 15px; }
  .wait code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
  .src { padding: 0 18px 14px; color: var(--faint); font-size: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <p>Northwind · Thursday, October 29</p>
      <h1>Standup</h1>
    </div>
    <div class="tally" id="tally">&nbsp;</div>
  </header>
  <div class="grid">
    <section class="card">
      <h2>Today's updates <span>vote what to discuss</span></h2>
      <ul id="list"><li class="loading">Loading…</li></ul>
      <form id="post"><input id="text" placeholder="Share an update…" aria-label="Update" autocomplete="off"><button>Post</button></form>
    </section>
    <section class="card" id="signups">
      <h2>Weekly signups <span>api.northwind.example</span></h2>
      <div class="kpi" id="kpi"></div>
      <div class="chart" id="chart"><div class="wait"><b>Live metrics are off</b><span>This page asks to reach <code>api.northwind.example</code></span></div></div>
      <div class="src" id="src">&nbsp;</div>
    </section>
  </div>
</main>
<script>
(async () => {
  const COLORS = { Alex: "#975a00", Mia: "#0a757b", Sam: "#2f62d0", Priya: "#8a3fd1", Jon: "#be2f7a" };
  const color = who => COLORS[who] ?? "#6b6500";
  const UP = `<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1 9.5 8.5H.5z"/></svg>`;
  const $ = id => document.getElementById(id);

  const db = await claude.use("db");
  let me = "Someone";
  try {
    const user = await claude.use("user");
    me = (user && (await user.name())) || me;
  } catch { /* no name: votes and posts are "Someone"'s */ }

  // Updates, in order, and the votes on them, kept as the snapshots come;
  // once both have come, a row that arrives after slides in, and a count
  // that grows bumps.
  let updates = null, votes = null, seen = null, counts = new Map();
  function render() {
    if (!updates || !votes) return;
    const by = new Map();
    for (const v of votes) (by.get(v.update) ?? by.set(v.update, []).get(v.update)).push(v.by);
    const list = $("list");
    list.replaceChildren(...updates.map(u => {
      const li = document.createElement("li");
      li.dataset.update = u.id;
      if (seen && !seen.has(u.id)) li.className = "fresh";
      const voters = by.get(u.id) ?? [];
      li.innerHTML = `<span class="av"></span><span class="body"><span class="text"></span><span class="by"></span></span><span class="voters"></span><button class="vote" type="button">${UP}<span class="n"></span></button>`;
      li.querySelector(".av").textContent = u.by[0];
      li.querySelector(".av").style.background = color(u.by);
      li.querySelector(".text").textContent = u.text;
      li.querySelector(".by").textContent = u.by;
      li.querySelector(".voters").replaceChildren(...voters.slice(0, 4).map(v => {
        const i = document.createElement("i");
        i.textContent = v[0];
        i.title = v;
        i.style.background = color(v);
        return i;
      }));
      const btn = li.querySelector(".vote");
      btn.querySelector(".n").textContent = voters.length;
      btn.setAttribute("aria-label", `Vote for “${u.text}”`);
      btn.classList.toggle("mine", voters.includes(me));
      if (seen && (counts.get(u.id) ?? 0) < voters.length) btn.classList.add("bump");
      counts.set(u.id, voters.length);
      btn.addEventListener("click", () => {
        const ref = db.doc(`votes/${u.id}~${me}`);
        return voters.includes(me) ? ref.delete() : ref.set({ update: u.id, by: me });
      });
      return li;
    }));
    if (!seen) seen = new Set();
    for (const u of updates) seen.add(u.id);
    const total = votes.length;
    $("tally").innerHTML = `<b>${updates.length}</b> updates · <b>${total}</b> votes`;
  }
  db.collection("updates").orderBy("order").onSnapshot(snap => {
    updates = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });
  db.collection("votes").onSnapshot(snap => {
    votes = snap.docs.map(d => d.data());
    render();
  });
  $("post").addEventListener("submit", e => {
    e.preventDefault();
    const text = $("text").value.trim();
    if (!text) return;
    $("text").value = "";
    const order = Math.max(0, ...(updates ?? []).map(u => u.order ?? 0)) + 1;
    db.collection("updates").add({ text, by: me, order });
  });

  // The signups chart, from Northwind's metrics API through the daemon,
  // once the owner has let the page reach it.
  const net = await claude.use("net");
  if (!net) return;
  let data;
  try {
    data = await (await net.fetch("https://api.northwind.example/v1/signups/weekly")).json();
  } catch (e) {
    $("chart").querySelector(".wait").innerHTML = `<b>Couldn't load signups</b><span>${String(e && e.code || e)}</span>`;
    return;
  }
  const weeks = data.weeks;
  const last = weeks.at(-1), prev = weeks.at(-2);
  const delta = Math.round(((last.value - prev.value) / prev.value) * 100);
  $("kpi").innerHTML = `<b>${last.value.toLocaleString("en-US")}</b><span class="delta">▲ ${delta}%</span><span class="note">week of ${last.week}</span>`;
  const W = Math.round($("chart").clientWidth) || 460, H = 270, top = 18, bottom = 22, max = Math.ceil(Math.max(...weeks.map(w => w.value)) / 1000) * 1000;
  const step = W / weeks.length, bw = step * 0.62;
  const y = v => top + (H - top - bottom) * (1 - v / max);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly signups, ${weeks[0].week} to ${last.week}">`;
  for (let g = 0; g <= max; g += 1000) svg += `<line class="gl" x1="0" x2="${W}" y1="${y(g)}" y2="${y(g)}"/><text class="ax" x="0" y="${y(g) - 4}">${g ? `${g / 1000}k` : ""}</text>`;
  weeks.forEach((w, i) => {
    const x = i * step + (step - bw) / 2;
    svg += `<rect class="b${i === weeks.length - 1 ? " last" : ""}" x="${x}" y="${y(w.value)}" width="${bw}" height="${y(0) - y(w.value)}" rx="3" style="transition-delay:${i * 40}ms"/>`;
    if (i % 2 === 1 || i === weeks.length - 1) svg += `<text class="ax" x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${w.week}</text>`;
  });
  svg += `<text class="lbl" x="${(weeks.length - 1) * step + step / 2}" y="${y(last.value) - 6}" text-anchor="middle">${(last.value / 1000).toFixed(1)}k</text></svg>`;
  $("chart").innerHTML = svg;
  $("src").textContent = `Live from api.northwind.example · ${data.source}`;
  $("chart").dataset.ready = "1";
  requestAnimationFrame(() => requestAnimationFrame(() => $("chart").classList.add("grown")));
})();
</script>
</body>
</html>
