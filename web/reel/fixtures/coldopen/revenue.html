<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northwind Q4 Revenue</title>
<style>
  /* Northwind's Q4 revenue dashboard: the app an agent publishes in the
     reel's cold open (web/reel/vignettes/coldopen.ts). The company, its
     accounts and every number are invented. Self-contained: no network, no
     timers, so a deterministic recording films it the same each run. */
  :root {
    color-scheme: light;
    --bg: #f4f3ef;
    --surface: #fcfcfb;
    --fg: #0b0b0b;
    --fg2: #52514e;
    --muted: #8a8882;
    --line: #e3e1da;
    --grid: #ecebe6;
    --s1: #2a78d6;
    --s2: #eb6834;
    --s3: #1baf7a;
    --good: #0f7b3f;
    --chip: #ebe9e3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #121211; --surface: #1a1a19; --fg: #f0efec; --fg2: #c3c2b7; --muted: #8f8e86;
      --line: #2e2d2a; --grid: #262523; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --good: #4cc27c; --chip: #2a2927;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --fg: #f0efec; --fg2: #c3c2b7; --muted: #8f8e86;
    --line: #2e2d2a; --grid: #262523; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --good: #4cc27c; --chip: #2a2927;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 22px 28px 28px; }
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .eyebrow { margin: 0 0 2px; color: var(--fg2); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.015em; }
  .seg { display: inline-flex; background: var(--chip); border-radius: 9px; padding: 3px; gap: 2px; }
  .seg button { font: inherit; font-size: 13px; border: 0; background: transparent; color: var(--fg2); padding: 6px 12px; border-radius: 7px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .kpi { padding: 14px 16px 10px; }
  .kpi .label { color: var(--fg2); font-size: 12.5px; }
  .kpi .value { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; margin: 2px 0 0; font-variant-numeric: tabular-nums; }
  .kpi .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
  .kpi .delta { color: var(--good); font-size: 12.5px; font-weight: 600; }
  .kpi .delta small { color: var(--muted); font-weight: 400; }
  .kpi svg { display: block; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 12px; }
  .panel { padding: 14px 16px 12px; }
  .panel h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .panel .sub { color: var(--fg2); font-size: 12.5px; }
  .ph { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 6px; }
  .legend { display: flex; gap: 14px; color: var(--fg2); font-size: 12.5px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .chart .end { font-size: 11.5px; font-weight: 600; fill: var(--fg2); }
  .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; box-shadow: 0 6px 18px rgba(0,0,0,0.12); font-size: 12.5px; min-width: 150px; display: none; }
  .tip b { display: block; margin-bottom: 4px; }
  .tip div { display: flex; justify-content: space-between; gap: 14px; align-items: center; }
  .tip div span { display: inline-flex; align-items: center; gap: 6px; color: var(--fg2); }
  .tip .v { font-variant-numeric: tabular-nums; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  td { padding: 7px 0; border-bottom: 1px solid var(--grid); }
  tr:last-child td { border-bottom: 0; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  td.up { color: var(--good); }
  .acct { display: inline-flex; align-items: center; gap: 8px; }
  input[type="search"] { font: inherit; font-size: 13px; width: 150px; padding: 5px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  @media (max-width: 760px) {
    main { padding: 16px; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid2 { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <p class="eyebrow">Northwind · Finance · FY26</p>
      <h1>Q4 Revenue</h1>
    </div>
    <div class="seg" role="group" aria-label="Region" id="regions"></div>
  </div>
  <section class="kpis" id="kpis"></section>
  <section class="grid2">
    <div class="card panel">
      <div class="ph"><div><h2>Weekly revenue by region</h2><span class="sub">Oct 6 – Dec 29 · $K</span></div><div class="legend" id="legend"></div></div>
      <div class="chart" id="chart"><div class="tip" id="tip"></div></div>
    </div>
    <div class="card panel">
      <div class="ph"><div><h2>Top accounts</h2><span class="sub" id="acctSub"></span></div><input type="search" id="q" placeholder="Filter accounts" aria-label="Filter accounts"></div>
      <table><thead><tr><th>Account</th><th class="n">Q4</th><th class="n">vs Q3</th></tr></thead><tbody id="rows"></tbody></table>
    </div>
  </section>
</main>
<script>
(() => {
  const REGIONS = [
    { id: "amer", name: "Americas", color: "var(--s1)" },
    { id: "emea", name: "EMEA", color: "var(--s2)" },
    { id: "apac", name: "APAC", color: "var(--s3)" },
  ];
  const WEEKS = ["Oct 6", "Oct 13", "Oct 20", "Oct 27", "Nov 3", "Nov 10", "Nov 17", "Nov 24", "Dec 1", "Dec 8", "Dec 15", "Dec 22", "Dec 29"];
  // Weekly revenue in $K, by region.
  const DATA = {
    amer: [1680, 1720, 1765, 1740, 1820, 1890, 2140, 2310, 2050, 2010, 2085, 1930, 2210],
    emea: [1010, 1045, 1030, 1090, 1120, 1105, 1260, 1420, 1240, 1275, 1310, 1150, 1360],
    apac: [520, 545, 590, 610, 640, 700, 760, 830, 820, 870, 905, 880, 960],
  };
  const ACCOUNTS = [
    { name: "Halvorsen Freight", region: "emea", q4: 2480, d: 18.2 },
    { name: "Cobalt Ridge Health", region: "amer", q4: 2310, d: 9.6 },
    { name: "Marlowe & Pike", region: "amer", q4: 1975, d: 22.4 },
    { name: "Tamsin Robotics", region: "apac", q4: 1640, d: 31.0 },
    { name: "Ostrava Mills", region: "emea", q4: 1415, d: 6.1 },
    { name: "Bluefin Logistics", region: "apac", q4: 1290, d: 14.8 },
    { name: "Quarry Lane Foods", region: "amer", q4: 1185, d: 4.3 },
    { name: "Ellery Studios", region: "amer", q4: 1060, d: 11.7 },
    { name: "Kestrel Energy", region: "emea", q4: 990, d: 8.9 },
  ];
  let region = "all";
  let query = "";
  const $ = id => document.getElementById(id);
  const svgNS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, parent) => { const e = document.createElementNS(svgNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const shown = () => REGIONS.filter(r => region === "all" || r.id === region);
  const fmtM = k => `$${(k / 1000).toFixed(1)}M`;

  // Region filter.
  const seg = $("regions");
  for (const r of [{ id: "all", name: "All regions" }, ...REGIONS]) {
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.region = r.id;
    b.innerHTML = (r.color ? `<span class="dot" style="background:${r.color}"></span>` : "") + r.name;
    b.onclick = () => { region = r.id; render(); };
    seg.appendChild(b);
  }

  function spark(values, color) {
    const w = 84, h = 28, lo = Math.min(...values), hi = Math.max(...values);
    const pts = values.map((v, i) => `${(i / (values.length - 1)) * w},${h - 3 - ((v - lo) / (hi - lo || 1)) * (h - 6)}`).join(" ");
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
  }

  function kpis() {
    const rs = shown();
    const weekly = WEEKS.map((_, i) => rs.reduce((n, r) => n + DATA[r.id][i], 0));
    const total = weekly.reduce((a, b) => a + b, 0);
    const scale = rs.length === 3 ? 1 : rs.length / 3;
    const tiles = [
      { label: "Revenue", value: fmtM(total), delta: "+12.4%", series: weekly },
      { label: "Gross margin", value: `${(61.8 - (region === "apac" ? 3.1 : 0)).toFixed(1)}%`, delta: "+1.6 pts", series: [58, 58.6, 59.1, 59, 59.8, 60.2, 60.9, 61.3, 61.1, 61.5, 61.6, 61.4, 61.8] },
      { label: "New customers", value: Math.round(1284 * scale).toLocaleString("en-US"), delta: "+9.1%", series: [80, 84, 91, 88, 95, 97, 112, 121, 103, 99, 108, 96, 110] },
      { label: "Net revenue retention", value: "118%", delta: "+3 pts", series: [112, 113, 113, 114, 115, 115, 116, 116, 117, 117, 117, 118, 118] },
    ];
    $("kpis").innerHTML = tiles.map(t => `<div class="card kpi"><div class="label">${t.label}</div><div class="row"><div><div class="value">${t.value}</div><div class="delta">▲ ${t.delta} <small>vs Q3</small></div></div>${spark(t.series, "var(--s1)")}</div></div>`).join("");
  }

  function chart() {
    const box = $("chart");
    box.querySelector("svg")?.remove();
    const W = 660, H = 300, L = 40, R = 70, T = 10, B = 24;
    const rs = shown();
    const max = 2400;
    const x = i => L + (i / (WEEKS.length - 1)) * (W - L - R);
    const y = v => T + (1 - v / max) * (H - T - B);
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Weekly revenue by region" });
    box.insertBefore(svg, box.firstChild);
    for (let v = 0; v <= max; v += 600) {
      el("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: "var(--grid)", "stroke-width": 1 }, svg);
      el("text", { x: L - 8, y: y(v) + 4, "text-anchor": "end" }, svg).textContent = v === 0 ? "0" : `${v / 1000}K`.replace(".0K", "K");
    }
    for (const i of [0, 4, 8, 12]) el("text", { x: x(i), y: H - 6, "text-anchor": "middle" }, svg).textContent = WEEKS[i];
    for (const r of rs) {
      const d = DATA[r.id].map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
      el("path", { d, fill: "none", stroke: r.color, "stroke-width": 2.25, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
      const last = DATA[r.id].at(-1);
      el("circle", { cx: x(12), cy: y(last), r: 4, fill: r.color, stroke: "var(--surface)", "stroke-width": 2 }, svg);
      el("text", { x: x(12) + 9, y: y(last) + 4, class: "end" }, svg).textContent = r.name;
    }
    // Hover: a crosshair and the week's values.
    const cross = el("line", { y1: T, y2: H - B, stroke: "var(--muted)", "stroke-width": 1, "stroke-dasharray": "3 3", visibility: "hidden" }, svg);
    const dots = rs.map(r => el("circle", { r: 4.5, fill: r.color, stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" }, svg));
    const hit = el("rect", { x: L, y: T, width: W - L - R, height: H - T - B, fill: "transparent" }, svg);
    const tip = $("tip");
    hit.addEventListener("mousemove", e => {
      const rect = svg.getBoundingClientRect();
      const px = ((e.clientX - rect.left) / rect.width) * W;
      const i = Math.max(0, Math.min(WEEKS.length - 1, Math.round(((px - L) / (W - L - R)) * (WEEKS.length - 1))));
      cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
      rs.forEach((r, k) => { dots[k].setAttribute("cx", x(i)); dots[k].setAttribute("cy", y(DATA[r.id][i])); dots[k].setAttribute("visibility", "visible"); });
      const total = rs.reduce((n, r) => n + DATA[r.id][i], 0);
      tip.innerHTML = `<b>Week of ${WEEKS[i]}</b>` + rs.map(r => `<div><span><span class="dot" style="background:${r.color}"></span>${r.name}</span><span class="v">$${DATA[r.id][i].toLocaleString("en-US")}K</span></div>`).join("") + (rs.length > 1 ? `<div><span>Total</span><span class="v">$${total.toLocaleString("en-US")}K</span></div>` : "");
      tip.style.display = "block";
      const sx = (x(i) / W) * rect.width;
      tip.style.left = `${sx > rect.width * 0.6 ? sx - tip.offsetWidth - 14 : sx + 14}px`;
      tip.style.top = `${(y(Math.max(...rs.map(r => DATA[r.id][i]))) / H) * rect.height}px`;
    });
    hit.addEventListener("mouseleave", () => { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); dots.forEach(d => d.setAttribute("visibility", "hidden")); });
    $("legend").innerHTML = rs.map(r => `<span><span class="dot" style="background:${r.color}"></span>${r.name}</span>`).join("");
  }

  function table() {
    const rows = ACCOUNTS.filter(a => (region === "all" || a.region === region) && a.name.toLowerCase().includes(query.toLowerCase()));
    const color = id => REGIONS.find(r => r.id === id).color;
    $("rows").innerHTML = rows.slice(0, 8).map(a => `<tr><td><span class="acct"><span class="dot" style="background:${color(a.region)}"></span>${a.name}</span></td><td class="n">$${(a.q4 / 1000).toFixed(2)}M</td><td class="n up">+${a.d.toFixed(1)}%</td></tr>`).join("") || `<tr><td colspan="3" style="color:var(--muted)">No accounts match.</td></tr>`;
    $("acctSub").textContent = `${rows.length} of ${ACCOUNTS.length} accounts`;
  }

  function render() {
    for (const b of seg.children) b.setAttribute("aria-pressed", String(b.dataset.region === region));
    kpis(); chart(); table();
  }
  $("q").addEventListener("input", e => { query = e.target.value; table(); });
  render();
})();
</script>
</body>
</html>
