<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northwind Customers</title>
<style>
  /* Northwind's customer accounts on a globe: the second version of the
     page in the reel's globe vignette (web/reel/vignettes/globe.ts), what
     the agent builds from the plain table. The company, its customers and
     every number are invented; the cities are real places. The land is
     Natural Earth's 1:110m outline (public domain), simplified. Drawn on
     a canvas by the page itself, in an orthographic projection; every
     motion reads the page's clock, in whole 30 fps frames (tick()), so a
     recording that steps that clock films the same frames each run. */
  :root {
    color-scheme: dark;
    --bg: #060a16;
    --panel: rgba(18, 27, 52, 0.72);
    --fg: #eef2ff;
    --fg2: #a9b4d6;
    --muted: #6f7ba3;
    --line: rgba(140, 160, 230, 0.16);
    --arc: #3fd0ff;
    --gold: #ffc35c;
    --hq: #ff7a59;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: radial-gradient(120% 90% at 30% 20%, #0d1736 0%, var(--bg) 60%); color: var(--fg); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  main { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); padding: 18px 20px 16px; gap: 10px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .eyebrow { margin: 0 0 2px; color: var(--arc); font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; }
  h1 { margin: 0; font-size: 24px; letter-spacing: -0.015em; font-weight: 650; }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; font-variant-numeric: tabular-nums; }
  .stat b { display: block; font-size: 17px; letter-spacing: -0.01em; }
  .stat span { color: var(--fg2); font-size: 11.5px; }
  .body { display: grid; grid-template-columns: minmax(0, 1fr) 236px; gap: 14px; min-height: 0; }
  .stage { position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  canvas.dragging { cursor: grabbing; }
  .hint { position: absolute; left: 6px; bottom: 4px; color: var(--muted); font-size: 12px; pointer-events: none; }
  .tip { position: absolute; left: 0; top: 0; pointer-events: none; background: rgba(9, 14, 32, 0.94); border: 1px solid rgba(255, 195, 92, 0.55); border-radius: 10px; padding: 8px 11px; min-width: 180px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5), 0 0 24px rgba(255, 195, 92, 0.18); opacity: 0; transform: translate(-50%, calc(-100% - 16px)); white-space: nowrap; }
  .tip.on { opacity: 1; }
  .tip .t1 { font-weight: 650; font-size: 14px; }
  .tip .t2 { color: var(--fg2); font-size: 12px; margin-top: 1px; }
  .tip .t3 { display: flex; justify-content: space-between; gap: 14px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .tip .t3 b { color: var(--gold); font-size: 15px; }
  .tip .t3 span { color: var(--fg2); font-size: 12px; align-self: flex-end; }
  aside { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .card h2 { margin: 0 0 8px; font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg2); font-weight: 600; }
  .legend { display: grid; gap: 7px; font-size: 12.5px; color: var(--fg2); }
  .legend .row { display: flex; align-items: center; gap: 10px; }
  .sizes { display: flex; align-items: flex-end; gap: 10px; }
  .sizes i { display: inline-block; border-radius: 50%; background: radial-gradient(circle, #fff3d6 0%, var(--gold) 45%, rgba(255, 195, 92, 0.15) 100%); }
  .sizes small { color: var(--muted); font-size: 11px; display: block; text-align: center; margin-top: 2px; }
  .swatch-arc { width: 34px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--hq), var(--arc)); }
  .swatch-hq { width: 10px; height: 10px; border-radius: 50%; background: var(--hq); box-shadow: 0 0 0 3px rgba(255, 122, 89, 0.3); margin: 0 12px 0 12px; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; counter-reset: r; }
  li { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; column-gap: 8px; align-items: center; padding: 3px 6px; border-radius: 7px; font-size: 12.5px; transition: background 160ms; }
  li::before { counter-increment: r; content: counter(r); color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  li .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .v { color: var(--gold); font-variant-numeric: tabular-nums; font-weight: 600; }
  li .bar { grid-column: 2 / 4; height: 3px; border-radius: 2px; background: rgba(140, 160, 230, 0.12); margin-top: 3px; overflow: hidden; }
  li .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--arc), var(--gold)); border-radius: 2px; }
  li.on { background: rgba(255, 195, 92, 0.14); }
  @media (max-width: 640px) {
    body { overflow: auto; }
    main { height: auto; padding: 14px 16px; }
    .body { grid-template-columns: minmax(0, 1fr); }
    .stage { height: 360px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <p class="eyebrow">Global footprint</p>
      <h1>Northwind Customers</h1>
    </div>
    <div class="stats">
      <div class="stat"><b id="s-accounts"></b><span>accounts</span></div>
      <div class="stat"><b id="s-arr"></b><span>total ARR</span></div>
      <div class="stat"><b id="s-countries"></b><span>countries</span></div>
    </div>
  </header>
  <div class="body">
    <div class="stage" id="stage">
      <canvas id="globe" aria-label="Globe of Northwind's customer accounts, with arcs from Portland"></canvas>
      <div class="tip" id="tip" role="status"></div>
      <div class="hint">Drag to spin &middot; hover a city</div>
    </div>
    <aside>
      <section class="card">
        <h2>Legend</h2>
        <div class="legend">
          <div class="row sizes">
            <div><i style="width:8px;height:8px"></i><small>$100k</small></div>
            <div><i style="width:14px;height:14px"></i><small>$500k</small></div>
            <div><i style="width:19px;height:19px"></i><small>$1M+</small></div>
            <span style="margin-left:4px">point size is ARR</span>
          </div>
          <div class="row"><span class="swatch-arc"></span>arc from HQ, width is ARR</div>
          <div class="row"><span class="swatch-hq"></span>HQ, Portland</div>
        </div>
      </section>
      <section class="card">
        <h2>Top 10 by ARR</h2>
        <ol id="top"></ol>
      </section>
    </aside>
  </div>
</main>

  for (let k = 0; k < flat.length; k += 2) {

    out.push([x / 4, y / 4]);
  }

});

  for (const [x, y] of r) { a = Math.min(a, x); b = Math.max(b, x); c = Math.min(c, y); d = Math.max(d, y); }
  return [a, b, c, d];
});
function onLand(lon, lat) {
  let inside = false;

    const bx = boxes[k];
    if (lon < bx[0] || lon > bx[1] || lat < bx[2] || lat > bx[3]) continue;

}

for (let lat = -58; lat <= 84; lat += 1.6) {
  const step = 1.6 / Math.max(0.2, Math.cos(lat * D));
  for (let lon = -180; lon < 180; lon += step) if (onLand(lon, lat) || onLand(lon - 360, lat) || onLand(lon + 360, lat)) dots.push(vec(lat, lon));
}
const coasts = rings.filter(r => r.some(p => p[1] > -60)).map(r => r.map(([x, y]) => vec(y, x)));
const graticule = [];
for (let lon = -180; lon < 180; lon += 20) { const l = []; for (let lat = -80; lat <= 80; lat += 4) l.push(vec(lat, lon)); graticule.push(l); }
for (let lat = -60; lat <= 60; lat += 20) { const l = []; for (let lon = -180; lon <= 180; lon += 4) l.push(vec(lat, lon)); graticule.push(l); }

// The accounts, and an arc from HQ to each, lifted by its length.
const hq = vec(HQ.lat, HQ.lon);
const pts = ACCOUNTS.map((a, i) => ({ i, a, v: vec(a[3], a[4]), r: 2.2 + Math.sqrt(a[5]) * 0.2 }));
function slerp(p, q, t) {
  const dot = Math.max(-1, Math.min(1, p[0] * q[0] + p[1] * q[1] + p[2] * q[2]));
  const w = Math.acos(dot), s = Math.sin(w);
  if (s < 1e-6) return p;
  const a = Math.sin((1 - t) * w) / s, b = Math.sin(t * w) / s;
  return [a * p[0] + b * q[0], a * p[1] + b * q[1], a * p[2] + b * q[2]];
}
const arcs = pts.map(p => {
  const w = Math.acos(Math.max(-1, Math.min(1, hq[0] * p.v[0] + hq[1] * p.v[1] + hq[2] * p.v[2])));
  const lift = 0.05 + 0.2 * (w / Math.PI);
  const n = 48, path = [];
  for (let k = 0; k <= n; k++) {
    const t = k / n, s = 1 + lift * Math.sin(Math.PI * t), u = slerp(hq, p.v, t);
    path.push([u[0] * s, u[1] * s, u[2] * s]);
  }
  return { p, path, ang: w, w: 0.7 + Math.sqrt(p.a[5]) * 0.075 };
});
// Sorted by distance: the near ones launch first.
const launch = arcs.map(a => a).sort((x, y) => x.ang - y.ang);
launch.forEach((a, order) => { a.order = order; });

// A seeded star field.
let seed = 0x9e3779b9;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
const stars = Array.from({ length: 170 }, () => ({ x: rnd(), y: rnd(), r: rnd() * 1.1 + 0.25, a: rnd() * 0.6 + 0.15, p: rnd() * 6.28 }));

const canvas = document.getElementById("globe");
const ctx = canvas.getContext("2d");
const tip = document.getElementById("tip");
let W = 0, H = 0, dpr = 1;
function size() {
  dpr = window.devicePixelRatio || 1;
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
}
new ResizeObserver(size).observe(canvas);
size();

// The view: the longitude and latitude at the globe's centre. It spins
// west to east, slows to a stop while the pointer is over it, and turns as
// the pointer drags it.
let lon0 = -38, lat0 = 24, spin = 1, over = false, drag = null, hover = -1, mouse = null;
const SPIN = 7; // degrees a second
let last = null, born = null;

function proj(v, R, cx, cy) {
  const c = Math.cos(lon0 * D), s = Math.sin(lon0 * D), ct = Math.cos(lat0 * D), st = Math.sin(lat0 * D);
  const x1 = v[0] * c + v[1] * s, y1 = -v[0] * s + v[1] * c, z1 = v[2];
  const d = x1 * ct + z1 * st, u = -x1 * st + z1 * ct;
  return { x: cx + R * y1, y: cy - R * u, d, off: y1 * y1 + u * u };
}
const shows = q => q.d > 0 || q.off > 1;

canvas.addEventListener("pointerenter", () => { over = true; });
canvas.addEventListener("pointerleave", () => { over = false; mouse = null; });
canvas.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, lon: lon0, lat: lat0 }; canvas.setPointerCapture(e.pointerId); canvas.classList.add("dragging"); });
canvas.addEventListener("pointerup", e => { drag = null; canvas.releasePointerCapture(e.pointerId); canvas.classList.remove("dragging"); });
canvas.addEventListener("pointermove", e => {
  const b = canvas.getBoundingClientRect();
  mouse = { x: e.clientX - b.left, y: e.clientY - b.top };
  if (drag) {
    const R = Math.min(W, H) * 0.44;
    lon0 = drag.lon - ((e.clientX - drag.x) / R) * 57;
    lat0 = Math.max(-20, Math.min(60, drag.lat + ((e.clientY - drag.y) / R) * 57));
  }
});

// The globe moves at 30 frames a second, on frames that start at
// whole-millisecond marks of each two-second span of the wall clock: a
// frame's picture depends only on which of those frames the time is in,
// so two draws within one frame draw the same picture.
function tick() {
  const t = Date.now(), m = ((t % 2000) + 2000) % 2000;
  let k = Math.ceil((m * 30) / 1000);
  while (k > 0 && Math.round(((k - 1) * 1000) / 30) >= m) k--;
  while (Math.round((k * 1000) / 30) < m) k++;
  return t - m + Math.round((k * 1000) / 30);
}

function frame() {
  const now = tick();
  if (born === null) born = now;
  const dt = last === null ? 0 : Math.min(0.1, (now - last) / 1000);
  last = now;
  const age = (now - born) / 1000;
  // The spin slows to a stop within 0.3 s under the pointer (a full stop,
  // so the globe holds still to be hovered or dragged) and picks up after.
  spin = over || drag ? Math.max(0, spin - dt / 0.3) : Math.min(1, spin + dt / 0.6);
  if (!drag) lon0 -= SPIN * spin * dt;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const intro = Math.min(1, age / 1.1), ease = 1 - Math.pow(1 - intro, 3);
  const R = Math.min(W, H) * 0.44 * (0.86 + 0.14 * ease), cx = W / 2, cy = H / 2 + 4;
  ctx.globalAlpha = 1;

  for (const s of stars) {
    ctx.fillStyle = `rgba(200,215,255,${s.a * (0.7 + 0.3 * Math.sin(age * 1.3 + s.p))})`;
    ctx.fillRect(s.x * W, s.y * H, s.r, s.r);
  }
  ctx.globalAlpha = ease;

  // Atmosphere and ocean.
  let g = ctx.createRadialGradient(cx, cy, R * 0.92, cx, cy, R * 1.28);
  g.addColorStop(0, "rgba(63,160,255,0.42)"); g.addColorStop(0.35, "rgba(63,140,255,0.14)"); g.addColorStop(1, "rgba(63,140,255,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R * 1.28, 0, 7); ctx.fill();
  g = ctx.createRadialGradient(cx - R * 0.35, cy - R * 0.4, R * 0.1, cx, cy, R);
  g.addColorStop(0, "#1c3a78"); g.addColorStop(0.55, "#0e1f48"); g.addColorStop(1, "#081330");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fill();

  // Graticule.
  ctx.lineWidth = 0.6; ctx.strokeStyle = "rgba(130,170,255,0.10)";
  ctx.beginPath();
  for (const l of graticule) {
    let pen = false;
    for (const v of l) { const q = proj(v, R, cx, cy); if (q.d > 0) { pen ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y); pen = true; } else pen = false; }
  }
  ctx.stroke();

  // Land dots, dimmer toward the limb.
  for (const v of dots) {
    const q = proj(v, R, cx, cy);
    if (q.d <= 0.02) continue;
    ctx.fillStyle = `rgba(110,160,255,${0.22 + 0.6 * q.d})`;
    const z = 1.05 + q.d * 0.75;
    ctx.fillRect(q.x - z / 2, q.y - z / 2, z, z);
  }
  // Coasts.
  ctx.lineWidth = 0.9; ctx.strokeStyle = "rgba(150,195,255,0.55)";
  ctx.beginPath();
  for (const r of coasts) {
    let pen = false;
    for (let k = 0; k <= r.length; k++) { const q = proj(r[k % r.length], R, cx, cy); if (q.d > 0) { pen ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y); pen = true; } else pen = false; }
  }
  ctx.stroke();

  // Arcs: each grows out from HQ in turn, then a pulse runs along it on a loop.
  ctx.lineCap = "round";
  const hp = proj(hq, R, cx, cy);
  for (const a of arcs) {
    const start = 0.35 + a.order * 0.045;
    const grow = Math.max(0, Math.min(1, (age - start) / 0.9));
    if (grow <= 0) continue;
    const n = a.path.length - 1, upto = Math.round(n * (1 - Math.pow(1 - grow, 2)));
    const q = a.path.map(v => proj(v, R, cx, cy));
    const end = q[n];
    const grad = ctx.createLinearGradient(hp.x, hp.y, end.x, end.y);
    grad.addColorStop(0, "rgba(255,122,89,0.75)"); grad.addColorStop(1, "rgba(63,208,255,0.85)");
    ctx.strokeStyle = grad; ctx.lineWidth = a.w; ctx.globalAlpha = ease * (hover === -1 || hover === a.p.i ? 0.55 : 0.2);
    ctx.beginPath();
    let pen = false;
    for (let k = 0; k <= upto; k++) { if (shows(q[k])) { pen ? ctx.lineTo(q[k].x, q[k].y) : ctx.moveTo(q[k].x, q[k].y); pen = true; } else pen = false; }
    ctx.stroke();
    if (grow >= 1) {
      // The pulse: a bright head with a short fading tail.
      const t = ((age - start - 0.9) / 2.6 + a.order * 0.37) % 1, head = Math.round(t * n);
      for (let k = Math.max(1, head - 9); k <= head; k++) {
        if (!shows(q[k]) || !shows(q[k - 1])) continue;
        ctx.globalAlpha = ease * ((k - head + 10) / 10) * 0.95;
        ctx.strokeStyle = "#e9fbff"; ctx.lineWidth = a.w + 0.9;
        ctx.beginPath(); ctx.moveTo(q[k - 1].x, q[k - 1].y); ctx.lineTo(q[k].x, q[k].y); ctx.stroke();
      }
    }
  }
  ctx.globalAlpha = ease;

  // The accounts' points: a glow sized by ARR, popping in as their arc lands.
  const spots = [];
  let near = -1, nearD = 1e9;
  for (const p of pts) {
    const q = proj(p.v, R, cx, cy);
    if (q.d <= 0.05) continue;
    const a = arcs[p.i], landed = Math.max(0, Math.min(1, (age - (0.35 + a.order * 0.045) - 0.75) / 0.35));
    if (landed <= 0) continue;
    const r = p.r * (0.6 + 0.4 * landed) * (hover === p.i ? 1.45 : 1);
    const glow = ctx.createRadialGradient(q.x, q.y, 0, q.x, q.y, r * 3.2);
    glow.addColorStop(0, "rgba(255,214,130,0.85)"); glow.addColorStop(0.35, "rgba(255,180,70,0.32)"); glow.addColorStop(1, "rgba(255,170,60,0)");
    ctx.globalAlpha = ease * landed * (0.45 + 0.55 * q.d);
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(q.x, q.y, r * 3.2, 0, 7); ctx.fill();
    ctx.fillStyle = "#fff4d8"; ctx.beginPath(); ctx.arc(q.x, q.y, r * 0.55, 0, 7); ctx.fill();
    if (hover === p.i) { ctx.strokeStyle = "rgba(255,214,130,0.9)"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(q.x, q.y, r * 1.6, 0, 7); ctx.stroke(); }
    spots.push([p.a[0], Math.round(q.x), Math.round(q.y)]);
    if (mouse && !drag) { const dd = Math.hypot(mouse.x - q.x, mouse.y - q.y); if (dd < Math.max(10, r * 1.6) && dd < nearD) { near = p.i; nearD = dd; } }
  }
  ctx.globalAlpha = 1;
  canvas.dataset.spots = JSON.stringify(spots);

  // HQ: a beacon pulsing outward.
  if (hp.d > 0) {
    for (let k = 0; k < 2; k++) {
      const t = (age * 0.8 + k * 0.5) % 1;
      ctx.globalAlpha = ease * (1 - t) * 0.8;
      ctx.strokeStyle = "#ff7a59"; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(hp.x, hp.y, 4 + t * 18, 0, 7); ctx.stroke();
    }
    ctx.globalAlpha = ease;
    ctx.fillStyle = "#ff7a59"; ctx.beginPath(); ctx.arc(hp.x, hp.y, 4.5, 0, 7); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(hp.x, hp.y, 1.8, 0, 7); ctx.fill();
    ctx.font = "600 12px system-ui, -apple-system, 'Segoe UI', sans-serif";
    ctx.fillStyle = "rgba(255,200,180,0.95)"; ctx.fillText("Portland HQ", hp.x + 9, hp.y - 7);
  }
  ctx.globalAlpha = 1;

  // The hovered account: its tooltip, and its row in the top 10.
  if (near !== hover) {
    if (rowOf.has(hover)) rowOf.get(hover).classList.remove("on");
    hover = near;
    if (hover >= 0) {
      const a = ACCOUNTS[hover];
      const km = Math.round(6371 * Math.acos(Math.max(-1, Math.min(1, hq[0] * pts[hover].v[0] + hq[1] * pts[hover].v[1] + hq[2] * pts[hover].v[2]))));
      tip.innerHTML = `<div class="t1"></div><div class="t2"></div><div class="t3"><b></b><span></span></div>`;
      tip.querySelector(".t1").textContent = a[0];
      tip.querySelector(".t2").textContent = `${a[1]}, ${a[2]}`;
      tip.querySelector(".t3 b").textContent = `${fmt(a[5])} ARR`;
      tip.querySelector(".t3 span").textContent = `${km.toLocaleString("en-US")} km from HQ`;
      if (rowOf.has(hover)) rowOf.get(hover).classList.add("on");
    }
    tip.classList.toggle("on", hover >= 0);
  }
  if (hover >= 0) {
    const q = proj(pts[hover].v, R, cx, cy);
    tip.style.left = `${q.x}px`; tip.style.top = `${q.y}px`;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
