<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northwind Launch Plan</title>
<style>
  /* Version 1 of Northwind's launch plan, seeded for the reel's history
     vignette (web/reel/vignettes/history.ts): a plain list. Northwind, its
     launch and its people are invented. Light only, as the reel is filmed. */
  :root { --bg: #ffffff; --fg: #222222; --muted: #666666; color-scheme: light; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 Georgia, "Times New Roman", serif; }
  main { max-width: 620px; margin: 48px auto; padding: 0 16px; }
  h1 { font-size: 28px; font-weight: normal; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 20px; }
</style>
</head>
<body>
<main>
  <h1>Launch plan</h1>
  <p>Northwind Atlas, November 18</p>
  <ul>
    <li>Book the venue</li>
    <li>Send the invitations</li>
    <li>Finish the press kit</li>
    <li>Brief the support team</li>
    <li>Print the badges</li>
    <li>Confirm the caterer</li>
    <li>Rehearse the keynote</li>
    <li>Go live on the website</li>
  </ul>
</main>
</body>
</html>
