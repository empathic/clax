<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch tracker</title>
<style>
  /* Northwind's launch tracker, as ClaxBot builds it in the reel's claxbot
     vignette (web/reel/vignettes/claxbot.ts): workstreams with owners and
     due dates, and a burndown of open work to launch day. The team, its
     product and its launch are invented. */
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --fg: #1c1b19;
    --muted: #6d6a63;
    --line: #e6e3dc;
    --grid: #eeebe5;
    --accent: #4f46e5;
    --accent-soft: #e0e7ff;
    --ideal: #b8b3a8;
    --ok: #2f9e44;
    --ok-soft: #e3f4e6;
    --run: #1c7ed6;
    --run-soft: #e2effb;
    --risk: #d9480f;
    --risk-soft: #fdebe1;
    --todo: #868e96;
    --todo-soft: #eff0f1;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161614; --card: #201f1c; --fg: #f1efe9; --muted: #a29e95; --line: #34322d; --grid: #2a2925;
      --accent: #8b85ff; --accent-soft: #2c2a52; --ideal: #6d6a63;
      --ok-soft: #1f3324; --run-soft: #1b2c3d; --risk-soft: #3d2418; --todo-soft: #2a2b2d;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161614; --card: #201f1c; --fg: #f1efe9; --muted: #a29e95; --line: #34322d; --grid: #2a2925;
    --accent: #8b85ff; --accent-soft: #2c2a52; --ideal: #6d6a63;
    --ok-soft: #1f3324; --run-soft: #1b2c3d; --risk-soft: #3d2418; --todo-soft: #2a2b2d;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 26px 28px 40px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .eyebrow { margin: 0 0 2px; color: var(--muted); font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; }
  h1 { margin: 0; font-size: 30px; letter-spacing: -.015em; }
  .launch { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; font-size: 14px; }
  .launch b { color: var(--accent); }
  .faces { display: flex; }
  .face { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 700; border: 2px solid var(--card); margin-left: -6px; }
  .faces .face:first-child { margin-left: 0; }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 16px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .kpi span { display: block; color: var(--muted); font-size: 12.5px; }
  .kpi strong { display: block; font-size: 30px; letter-spacing: -.02em; line-height: 1.15; margin-top: 2px; }
  .kpi small { color: var(--muted); font-size: 12.5px; }
  .kpi.risk strong { color: var(--risk); }
  .kpi.ok strong { color: var(--ok); }
  .grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 14px; margin-bottom: 16px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; min-width: 0; }
  .panel h2 { margin: 0; font-size: 15px; }
  .panel .sub { margin: 0 0 8px; color: var(--muted); font-size: 12.5px; }
  .legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
  .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
  svg { display: block; width: 100%; height: auto; }
  .axis { fill: var(--muted); font-size: 11px; }
  .owners { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 11px; }
  .owners li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 14px; }
  .owners .face { margin: 0; border: 0; }
  .bar { height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; display: flex; margin-top: 3px; }
  .bar span { height: 100%; }
  .owners .n { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  td.who { white-space: nowrap; }
  td.who .face { display: inline-grid; margin: 0 8px 0 0; border: 0; width: 24px; height: 24px; font-size: 11px; vertical-align: middle; }
  td.due { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--muted); }
  .ws { font-size: 12px; color: var(--muted); }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .pill.done { background: var(--ok-soft); color: var(--ok); }
  .pill.doing { background: var(--run-soft); color: var(--run); }
  .pill.risk { background: var(--risk-soft); color: var(--risk); }
  .pill.todo { background: var(--todo-soft); color: var(--todo); }
  @media (max-width: 760px) {
    main { padding: 18px 16px 32px; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid { grid-template-columns: minmax(0, 1fr); }
    td.ws-col, th.ws-col { display: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <p class="eyebrow">Northwind · Atlas 2.0</p>
      <h1>Launch tracker</h1>
    </div>
    <div class="launch"><span>Launch day <b>Tue, Nov 18</b></span><span class="faces" id="faces"></span></div>
  </header>
  <section class="kpis" aria-label="Summary">
    <div class="kpi"><span>Points left</span><strong id="k-left">0</strong><small id="k-left-sub"></small></div>
    <div class="kpi ok"><span>Tasks done</span><strong id="k-done">0</strong><small id="k-done-sub"></small></div>
    <div class="kpi risk"><span>At risk</span><strong id="k-risk">0</strong><small id="k-risk-sub"></small></div>
    <div class="kpi"><span>Days to launch</span><strong>19</strong><small>Code freeze Nov 11</small></div>
  </section>
  <section class="grid">
    <div class="panel">
      <h2>Burndown</h2>
      <p class="sub">Open points from kickoff, Oct 13, to launch day</p>
      <div class="legend"><span><i style="background: var(--accent)"></i>Actual</span><span><i style="background: var(--ideal)"></i>Ideal</span><span><i style="background: var(--risk)"></i>Forecast</span></div>
      <svg id="burn" viewBox="0 0 640 230" role="img" aria-label="Burndown of open points"></svg>
    </div>
    <div class="panel">
      <h2>By owner</h2>
      <p class="sub">Points done and open</p>
      <ul class="owners" id="owners"></ul>
    </div>
  </section>
  <section class="panel">
    <table>
      <thead><tr><th>Task</th><th class="ws-col">Workstream</th><th>Owner</th><th>Due</th><th>Status</th></tr></thead>
      <tbody id="tasks"></tbody>
    </table>
  </section>
</main>
<script>
(function () {
  var PEOPLE = {
    Priya: "#7048e8", Mia: "#0ca678", Sam: "#1c7ed6", Alex: "#e8590c", Jonah: "#c2255c"
  };
  var LABEL = { done: "Done", doing: "In progress", risk: "At risk", todo: "Not started" };
  var TASKS = [
    ["Final pricing page", "Marketing", "Mia", "Oct 31", "risk", 8],
    ["Billing migration dry run", "Product", "Priya", "Nov 3", "doing", 13],
    ["Partner briefing deck", "Sales", "Sam", "Nov 4", "doing", 5],
    ["Help-center articles", "Support", "Jonah", "Nov 6", "todo", 8],
    ["Launch email sequence", "Marketing", "Mia", "Nov 7", "doing", 5],
    ["Load test at 3x traffic", "Product", "Priya", "Nov 10", "risk", 13],
    ["Press embargo list", "Marketing", "Alex", "Nov 12", "todo", 3],
    ["Keynote demo script", "Product", "Alex", "Nov 14", "todo", 8],
    ["Onboarding checklist", "Product", "Priya", "Oct 24", "done", 8],
    ["Beta feedback triage", "Support", "Jonah", "Oct 22", "done", 5],
    ["Sales playbook v2", "Sales", "Sam", "Oct 27", "done", 8],
    ["Brand refresh assets", "Marketing", "Mia", "Oct 20", "done", 13]
  ];
  // Open points at each day from Oct 13 (day 0); today is Oct 30 (day 17).
  var ACTUAL = [120, 120, 117, 112, 110, 104, 101, 101, 96, 90, 85, 83, 80, 74, 70, 68, 63, 60];
  var DAYS = 36; // Oct 13 to Nov 18
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c]; }); };
  var face = function (name) { return "<span class=\"face\" title=\"" + esc(name) + "\" style=\"background:" + PEOPLE[name] + "\">" + esc(name.charAt(0)) + "</span>"; };

  document.getElementById("faces").innerHTML = Object.keys(PEOPLE).map(face).join("");

  var done = TASKS.filter(function (t) { return t[4] === "done"; });
  var risk = TASKS.filter(function (t) { return t[4] === "risk"; });
  var left = ACTUAL[ACTUAL.length - 1];
  document.getElementById("k-left").textContent = left;
  document.getElementById("k-left-sub").textContent = "of 120, down " + (120 - left) + " since kickoff";
  document.getElementById("k-done").textContent = done.length + " / " + TASKS.length;
  document.getElementById("k-done-sub").textContent = "4 this week";
  document.getElementById("k-risk").textContent = risk.length;
  document.getElementById("k-risk-sub").textContent = risk.map(function (t) { return t[0]; }).join(", ");

  // The burndown: ideal, actual to today, and the forecast at the last week's pace.
  var W = 640, H = 230, L = 34, R = 12, T = 10, B = 26;
  var x = function (d) { return L + (W - L - R) * d / DAYS; };
  var y = function (p) { return T + (H - T - B) * (1 - p / 120); };
  var g = [];
  [0, 30, 60, 90, 120].forEach(function (p) {
    g.push("<line x1=\"" + L + "\" x2=\"" + (W - R) + "\" y1=\"" + y(p) + "\" y2=\"" + y(p) + "\" stroke=\"var(--grid)\"/>");
    g.push("<text class=\"axis\" x=\"" + (L - 6) + "\" y=\"" + (y(p) + 4) + "\" text-anchor=\"end\">" + p + "</text>");
  });
  [[0, "Oct 13"], [7, "Oct 20"], [14, "Oct 27"], [21, "Nov 3"], [28, "Nov 10"], [36, "Nov 18"]].forEach(function (t) {
    g.push("<text class=\"axis\" x=\"" + x(t[0]) + "\" y=\"" + (H - 8) + "\" text-anchor=\"" + (t[0] === DAYS ? "end" : "middle") + "\">" + t[1] + "</text>");
  });
  var today = ACTUAL.length - 1;
  var pace = (ACTUAL[today - 7] - ACTUAL[today]) / 7;
  var end = Math.min(DAYS, today + ACTUAL[today] / pace);
  var area = ACTUAL.map(function (p, d) { return x(d) + "," + y(p); }).join(" ");
  g.push("<polygon points=\"" + x(0) + "," + y(0) + " " + area + " " + x(today) + "," + y(0) + "\" fill=\"var(--accent-soft)\" opacity=\".7\"/>");
  g.push("<line x1=\"" + x(0) + "\" y1=\"" + y(120) + "\" x2=\"" + x(DAYS) + "\" y2=\"" + y(0) + "\" stroke=\"var(--ideal)\" stroke-width=\"2\" stroke-dasharray=\"5 5\"/>");
  g.push("<line x1=\"" + x(today) + "\" y1=\"" + y(ACTUAL[today]) + "\" x2=\"" + x(end) + "\" y2=\"" + y(ACTUAL[today] - pace * (end - today)) + "\" stroke=\"var(--risk)\" stroke-width=\"2\" stroke-dasharray=\"2 4\" stroke-linecap=\"round\"/>");
  g.push("<polyline points=\"" + area + "\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>");
  g.push("<line x1=\"" + x(today) + "\" x2=\"" + x(today) + "\" y1=\"" + T + "\" y2=\"" + (H - B) + "\" stroke=\"var(--fg)\" stroke-opacity=\".25\"/>");
  g.push("<circle cx=\"" + x(today) + "\" cy=\"" + y(ACTUAL[today]) + "\" r=\"5\" fill=\"var(--accent)\" stroke=\"var(--card)\" stroke-width=\"2\"/>");
  g.push("<text x=\"" + (x(today) + 8) + "\" y=\"" + (y(ACTUAL[today]) - 10) + "\" font-size=\"12\" font-weight=\"700\" fill=\"var(--fg)\">Today · " + ACTUAL[today] + " pts</text>");
  document.getElementById("burn").innerHTML = g.join("");

  // Owners: points done and open, most open first.
  var by = {};
  TASKS.forEach(function (t) {
    var o = by[t[2]] || (by[t[2]] = { done: 0, open: 0 });
    o[t[4] === "done" ? "done" : "open"] += t[5];
  });
  var most = Math.max.apply(null, Object.keys(by).map(function (k) { return by[k].done + by[k].open; }));
  document.getElementById("owners").innerHTML = Object.keys(by).sort(function (a, b) { return by[b].open - by[a].open; }).map(function (k) {
    var o = by[k];
    return "<li>" + face(k) + "<div><div>" + esc(k) + "</div><div class=\"bar\"><span style=\"width:" + (100 * o.done / most) + "%;background:" + PEOPLE[k] + "\"></span><span style=\"width:" + (100 * o.open / most) + "%;background:" + PEOPLE[k] + ";opacity:.28\"></span></div></div><span class=\"n\">" + o.done + " / " + (o.done + o.open) + "</span></li>";
  }).join("");

  // Tasks: open first, by due date, then what is done.
  document.getElementById("tasks").innerHTML = TASKS.map(function (t) {
    return "<tr><td>" + esc(t[0]) + "</td><td class=\"ws-col ws\">" + esc(t[1]) + "</td><td class=\"who\">" + face(t[2]) + esc(t[2]) + "</td><td class=\"due\">" + esc(t[3]) + "</td><td><span class=\"pill " + t[4] + "\">" + LABEL[t[4]] + "</span></td></tr>";
  }).join("");
})();
</script>
</body>
</html>
