<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northwind Orders</title>
<style>
  /* Northwind's raw order export, the first version of the reel's "From raw
     data to answers" vignette (web/reel/vignettes/dash.ts): a plain grid of
     orders, as a spreadsheet shows them. The company, its products and every
     number are invented; the rows come from a fixed seed, so each run shows
     the same ones. Light only, as the reel is filmed. */
  :root { color-scheme: light; --bg: #ffffff; --fg: #1f1f1d; --muted: #6d6b66; --line: #e2e0da; --head: #f3f2ee; --zebra: #fafaf8; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 17px; font-weight: 600; }
  header p { margin: 0; color: var(--muted); font-size: 12.5px; }
  .wrap { overflow: auto; height: calc(100vh - 47px - 30px); }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 4px 10px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); white-space: nowrap; text-align: left; }
  th { position: sticky; top: 0; background: var(--head); font-weight: 600; color: #3b3a37; z-index: 1; }
  td.n, th.n { text-align: right; }
  td.i { color: var(--muted); text-align: right; width: 1%; }
  tbody tr:nth-child(even) { background: var(--zebra); }
  footer { height: 30px; display: flex; align-items: center; gap: 16px; padding: 0 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; background: var(--head); }
</style>
</head>
<body>
<header><h1>Northwind Orders</h1><p>orders_2026.csv · exported Nov 2, 2026</p></header>
<div class="wrap">
  <table>
    <thead><tr><th class="n">#</th><th>Order</th><th>Date</th><th>Region</th><th>Product</th><th class="n">Units</th><th class="n">Unit price</th><th class="n">Revenue</th><th>Status</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<footer><span>Rows 1–200 of 1,204</span><span>9 columns</span><span>No filter</span></footer>
<script>
  // mulberry32 from a fixed seed: the same rows each run.
  let s = 0x0c0ffee;
  const rand = () => { s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const pick = a => a[Math.floor(rand() * a.length)];
  const REGIONS = ["North", "South", "East", "West", "East", "North"];
  const PRODUCTS = [["Trailhead 2 Tent", 289], ["Ridge Daypack", 94], ["Summit Shell Jacket", 179], ["Basecamp Stove", 64], ["Cascade Bottle", 22], ["Alpine Headlamp", 39], ["Drift Sleeping Bag", 149]];
  const STATUS = ["Shipped", "Shipped", "Shipped", "Delivered", "Delivered", "Pending", "Returned"];
  const money = n => "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const rows = [];
  let day = Date.UTC(2026, 0, 3);
  for (let i = 0; i < 200; i++) {
    day += Math.floor(rand() * 2) * 86400000;
    const [product, price] = pick(PRODUCTS);
    const units = 1 + Math.floor(rand() * rand() * 60);
    const date = new Date(day).toISOString().slice(0, 10);
    rows.push(`<tr><td class="i">${i + 1}</td><td>NW-${String(10421 + i * 3 + Math.floor(rand() * 3))}</td><td>${date}</td><td>${pick(REGIONS)}</td><td>${product}</td><td class="n">${units}</td><td class="n">${money(price)}</td><td class="n">${money(units * price)}</td><td>${pick(STATUS)}</td></tr>`);
  }
  document.getElementById("rows").innerHTML = rows.join("");
</script>
</body>
</html>
