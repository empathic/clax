[workspace]
resolver = "2"
members = [
    "crates/clax-core",
    "crates/clax-server",
    "crates/clax-cli",
    "crates/clax-mcp",
    "crates/clax-hooks",
    "crates/clax-fake-exe",
    "crates/clax-testkit",
    "crates/clax-embedded",
    "crates/clax-commands",
    "crates/clax-sample",
    "crates/clax-realtime",
    "crates/clax-http",
    "crates/clax-store",
    "crates/clax-git",
    "crates/clax-rt",
    "crates/clax-content-git",
]
# The Cloudflare Worker is a workspace of its own (wasm32 only, rusqlite 0.40).
exclude = ["crates/clax-worker"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "GPL-2.0-only"
repository = "https://github.com/empathic/clax"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(clax_embedded)', 'cfg(clax_split)', 'cfg(clax_split, values(any()))'] }

[workspace.dependencies]
anyhow = "1"
# The features that build for wasm32 too; a crate that serves natively adds
# axum's `tokio`, `http1` and `ws` under its native target.
axum = { version = "0.8", default-features = false, features = ["form", "json", "matched-path", "original-uri", "query", "tracing", "multipart", "macros"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
nix = { version = "0.31", default-features = false }
mime_guess = "2"
rand = "0.9"
ring = "0.17.14"
# `blocking` does not build for wasm32: each crate that uses it adds it.
reqwest = { version = "0.12", features = ["json", "multipart"], default-features = false }
# The tool set alone. The stdio and streamable HTTP transports run on
# tokio's runtime: the crates that serve them add them natively.
rmcp = { version = "3.5", features = ["server", "macros"] }
semver = "1"
# `fallible_uint` keeps `u64`/`usize` as SQL integers, checked against the
# `i64` range, as rusqlite before 0.33 had them by default.
rusqlite = { version = "0.40", features = ["bundled", "hooks", "fallible_uint"] }
rust-embed = { version = "8", features = ["include-exclude", "interpolate-folder-path"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
# No features here: each crate names the ones it needs (`full` does not
# build for wasm32-unknown-unknown).
tokio = { version = "1", default-features = false }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["timeout"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "compression-br"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "1"
url = "2"
tempfile = "3"
toml = "0.9"
toml_edit = "0.25"
assert_cmd = "2"
predicates = "3"

# Debug builds, and the tests built on them, keep line tables for this
# workspace's crates, so backtraces still name file:line, and no debug info
# for dependencies: smaller and faster to build and link. Locals in a
# debugger need full debug info: `CARGO_PROFILE_DEV_DEBUG=true cargo build`.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
