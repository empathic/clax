[workspace]
resolver = "2"
members = [
    "crates/clax-core",
    "crates/clax-server",
    "crates/clax-cli",
    "crates/clax-mcp",
    "crates/clax-hooks",
    "crates/clax-fake-exe",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/empathic/clax"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart", "macros", "ws"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
nix = { version = "0.31", default-features = false }
mime_guess = "2"
rand = "0.9"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"], default-features = false }
rmcp = { version = "3.5", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
semver = "1"
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
rust-embed = { version = "8", features = ["include-exclude"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["timeout"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "compression-br"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "1"
url = "2"
tempfile = "3"
toml = "0.9"
toml_edit = "0.25"
assert_cmd = "2"
predicates = "3"
