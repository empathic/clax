[package]
name = "clax-worker"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
description = "A Cloudflare Worker that runs the Clax server in a Durable Object per instance, its database in the object's own storage"

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["json", "query"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# ClaxBot's run loop, which the instance drives from its alarm (src/bot.rs).
clax-bot = { path = "../clax-bot" }
# ClaxBot's code-mode sandbox contract, which src/sandbox implements.
clax-bot-sandbox = { path = "../clax-bot-sandbox" }
clax-content-git = { path = "../clax-content-git" }
clax-core = { path = "../clax-core" }
clax-do-vfs = { path = "vfs" }
clax-git = { path = "../clax-git" }
clax-http = { path = "../clax-http" }
clax-realtime = { path = "../clax-realtime" }
clax-rt = { path = "../clax-rt" }
clax-sample = { path = "../clax-sample" }
clax-server = { path = "../clax-server" }
clax-store = { path = "../clax-store" }
console_error_panic_hook = "0.1"
# Reading a request's body in bounded chunks (`ByteStream`).
futures-util = "0.3"
# The owner token and socket keys: `crypto.getRandomValues` on wasm32.
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
# The web UI the router renders pages from (`src/web.rs`), named by the
# build script (`interpolate-folder-path`).
rust-embed.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", default-features = false, features = ["sync"] }
tower-service = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# The body the Worker relays to the instance's object (`forward_undeclared`).
wasm-streams = "0.7"
worker = { version = "0.8.7", features = ["http", "axum", "queue"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# The test daemon in process, for the git token routes over the stand-in.
clax-testkit = { path = "../clax-testkit" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
