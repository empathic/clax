[package]
name = "clax-do-vfs"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "A SQLite VFS that keeps a database's pages in a page store, such as a Durable Object's SQL storage"

# The crate is outside the Clax workspace, so it forbids `unsafe_code` itself,
# as the workspace does.
[lints.rust]
unsafe_code = "forbid"

[dependencies]
# The VFS glue sqlite-wasm-rs re-exports; on wasm32 it registers into the
# SQLite that rusqlite links through sqlite-wasm-rs, natively into the SQLite
# that rusqlite links through libsqlite3-sys.
# Exactly 0.1.1: the VFS tells files apart by the address of the name buffer
# its `xOpen` passes to `VfsStore::add_file` and then keeps in the handle
# (`Registry::handles` in src/lib.rs).
rsqlite-vfs = "=0.1.1"
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
sqlite-wasm-rs = { version = "0.5.5", default-features = false }

[dev-dependencies]
rand = "0.9"
