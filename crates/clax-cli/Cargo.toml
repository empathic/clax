[package]
name = "clax-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
# Every file in tests/ is a module of one of the two integration test
# binaries below.
autotests = false

[lints]
workspace = true

[[bin]]
name = "clax"
path = "src/main.rs"

[dependencies]
clax-core = { path = "../clax-core" }
clax-server = { path = "../clax-server" }
clax-mcp = { path = "../clax-mcp" }
clax-hooks = { path = "../clax-hooks" }
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
reqwest.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
base64.workspace = true
nix = { workspace = true, features = ["signal"] }
semver.workspace = true
tracing.workspace = true
rust-embed.workspace = true
toml.workspace = true
toml_edit.workspace = true
sha2 = "0.11"

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
clax-fake-exe = { path = "../clax-fake-exe" }
rusqlite.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

# The tests that need no other test forking in their process.
[[test]]
name = "descriptors"
path = "tests/descriptors.rs"
