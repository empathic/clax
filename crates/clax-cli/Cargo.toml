[package]
name = "clax-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
# Every file in tests/ is a module of one of the two integration test
# binaries below.
autotests = false

[lints]
workspace = true

[[bin]]
name = "clax"
path = "src/main.rs"

[dependencies]
clax-commands = { path = "../clax-commands" }
clax-core = { path = "../clax-core" }
clax-server = { path = "../clax-server" }
clax-sample = { path = "../clax-sample" }
clax-realtime = { path = "../clax-realtime" }
clax-embedded = { path = "../clax-embedded" }
clax-http = { path = "../clax-http" }
anyhow.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true
nix.workspace = true

[dev-dependencies]
clax-store = { path = "../clax-store" }
chrono.workspace = true
reqwest.workspace = true
serde_json.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
clax-fake-exe = { path = "../clax-fake-exe" }
rusqlite.workspace = true
clax-testkit = { path = "../clax-testkit" }
clax-http = { path = "../clax-http" }

[[test]]
name = "integration"
path = "tests/integration.rs"

# The tests that need no other test forking in their process.
[[test]]
name = "descriptors"
path = "tests/descriptors.rs"
