[package]
name = "clax-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# The ContentStore contract checks (`content::contract`), for other crates'
# implementations to run.
content-contract = []

[dependencies]
async-trait = "0.1"
base64.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.3"
http = "1"
icu_normalizer = "2"
icu_properties = "2"
unicode-security = "0.1"
chrono.workspace = true
mime_guess.workspace = true
rand.workspace = true
ring.workspace = true
sha2 = "0.11"
rusqlite.workspace = true
ryu-js = "1"
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Sync primitives only: the core runs no runtime of its own, and the
# workspace's `full` tokio does not build for wasm32-unknown-unknown.
tokio = { version = "1", default-features = false, features = ["sync"] }
toml.workspace = true
ulid.workspace = true
url.workspace = true
web-time = "1"

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs"] }

# The Worker's random source (`crypto.getRandomValues`), for getrandom 0.3
# and for ring's getrandom 0.2. getrandom 0.3 also needs
# `--cfg getrandom_backend="wasm_js"`, which .cargo/config.toml sets for
# this target.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
ring = { workspace = true, features = ["wasm32_unknown_unknown_js"] }
# `Utc::now` from the Worker's `Date.now()`, where `SystemTime::now` panics.
chrono = { workspace = true, features = ["wasmbind"] }

# A process's start time, for telling a parent-PID credential file's process
# from a later one given its PID (spec 2026-10-08 §6.8).
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
sysinfo = { version = "0.38", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile.workspace = true
clax-fake-exe = { path = "../clax-fake-exe" }
nix = { workspace = true, features = ["time", "user"] }
tokio = { workspace = true, features = ["sync", "macros", "rt", "rt-multi-thread", "time"] }
