[package]
name = "clax-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
base64.workspace = true
getrandom = "0.3"
http = "1"
icu_normalizer = "2"
icu_properties = "2"
unicode-security = "0.1"
chrono.workspace = true
mime_guess.workspace = true
nix = { workspace = true, features = ["fs", "signal"] }
rand.workspace = true
ring.workspace = true
sha2 = "0.11"
rusqlite.workspace = true
ryu-js = "1"
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync"] }
toml.workspace = true
ulid.workspace = true
url.workspace = true

# A process's start time, for telling a parent-PID credential file's process
# from a later one given its PID (spec 2026-10-08 §6.8).
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
sysinfo = { version = "0.38", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile.workspace = true
clax-fake-exe = { path = "../clax-fake-exe" }
nix = { workspace = true, features = ["time", "user"] }
tokio = { workspace = true, features = ["sync", "macros", "rt"] }
