[package]
name = "clax-store"
version.workspace = true
edition.workspace = true
license = "GPL-2.0-only OR AGPL-3.0-only"

[lints]
workspace = true

[dependencies]
clax-core = { path = "../clax-core" }
base64.workspace = true
chrono.workspace = true
# XChaCha20-Poly1305 for sealed secrets (`secrets`), without getrandom: the
# nonces come from clax-core's random source.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
zeroize = { version = "1", default-features = false }
mime_guess.workspace = true
rand.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
tokio = { workspace = true, features = ["sync"] }
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
web-time = "1"
tracing.workspace = true
unicode-security = "0.1"
url.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs", "signal"] }

[dev-dependencies]
tempfile.workspace = true
clax-fake-exe = { path = "../clax-fake-exe" }
nix = { workspace = true, features = ["time", "user"] }
tokio = { workspace = true, features = ["sync", "macros", "rt", "rt-multi-thread", "time"] }
