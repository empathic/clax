[package]
name = "clax-content-git"
version.workspace = true
edition.workspace = true
license = "GPL-2.0-only OR AGPL-3.0-only"
description = "Clax artifact content kept in git repositories, one per artifact, over any clax-git RepoHost"
# Every file in tests/ is a module of the one integration test binary.
autotests = false

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
clax-core = { path = "../clax-core" }
clax-git = { path = "../clax-git" }

[dev-dependencies]
clax-store = { path = "../clax-store" }
# The workspace's axum and tokio carry no runtime features (clax-server
# builds them for wasm32); the tests serve smart HTTP and run git natively.
axum = { workspace = true, features = ["http1", "tokio"] }
# A store on one connection, as a Durable Object opens it.
rusqlite.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "process", "rt-multi-thread", "time"] }

[[test]]
name = "integration"
path = "tests/integration.rs"
