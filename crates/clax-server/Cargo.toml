[package]
name = "clax-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
clax-core = { path = "../clax-core" }
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
nix = { workspace = true, features = ["signal", "resource"] }
socket2 = "0.6"
rand.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures = "0.3"
mime_guess.workspace = true
clax-mcp = { path = "../clax-mcp" }
rmcp = { workspace = true }
reqwest = { workspace = true, features = ["stream", "rustls-tls"] }
base64.workspace = true
tempfile = { workspace = true, optional = true }

[features]
test-routes = []
# Exposes `clax_server::testing` (an in-process test daemon) to other crates' tests.
test-support = ["dep:tempfile"]

[dev-dependencies]
clax-server = { path = ".", features = ["test-routes", "test-support"] }
bytes = "1"
sha2 = "0.11"
reqwest = { workspace = true, features = ["stream"] }
tempfile.workspace = true
chrono.workspace = true
rusqlite.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite.workspace = true
