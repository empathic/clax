[package]
name = "clax-server"
version.workspace = true
edition.workspace = true
license = "GPL-2.0-only OR AGPL-3.0-only"
# Every file in tests/ is a module of one of the two integration test
# binaries below.
autotests = false

[lints]
workspace = true

[features]
default = ["native-sandbox"]
# ClaxBot's scripts run in embedded QuickJS (`clax-bot-js`, native only).
# Without it the daemon answers every script `unavailable`, and its runs
# wait (the crates.io package builds without it: the patched QuickJS
# crates it needs are not published).
native-sandbox = ["dep:clax-bot-js"]

# What builds on both targets: the router, its handlers and their state.
# The daemon around them (sockets, signals, processes, the files of a home)
# is native only; see the crate documentation in src/lib.rs.
[dependencies]
clax-core = { path = "../clax-core" }
clax-store = { path = "../clax-store" }
clax-sample = { path = "../clax-sample" }
clax-realtime = { path = "../clax-realtime" }
clax-http = { path = "../clax-http" }
clax-rt = { path = "../clax-rt" }
clax-bot = { path = "../clax-bot" }
clax-bot-sandbox = { path = "../clax-bot-sandbox" }
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "macros"] }
tokio-stream.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
tower = { workspace = true, features = ["util"] }
tower-http.workspace = true
tracing.workspace = true
futures = "0.3"
mime_guess.workspace = true
qrcode.workspace = true
clax-mcp = { path = "../clax-mcp" }
reqwest = { workspace = true, features = ["stream"] }
base64.workspace = true
sha2 = "0.11"
url.workspace = true
web-time = "1"
async-trait = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { workspace = true, features = ["http1", "tokio", "tower-log", "ws"] }
nix = { workspace = true, features = ["signal", "resource", "hostname"] }
reqwest = { workspace = true, features = ["rustls-tls"] }
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
socket2 = "0.6"
tokio = { workspace = true, features = ["full"] }
tracing-subscriber.workspace = true

# The MCP adapter's tool set holds rmcp's `local` tool router, which is
# not `Send`; a Worker has one thread.
# ClaxBot's native sandbox (embedded QuickJS), behind `native-sandbox`.
# Not on Android or iOS, where the Clax app embeds the core: the vendored
# QuickJS bindings (third_party/clax-rquickjs-sys) cover macOS and Linux
# only, so the app's ClaxBot answers scripts `unavailable`.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android", target_os = "ios")))'.dependencies]
clax-bot-js = { path = "../clax-bot-js", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
send_wrapper = { version = "0.6", features = ["futures"] }

[dev-dependencies]
clax-testkit = { path = "../clax-testkit" }
clax-http = { path = "../clax-http" }
async-trait = "0.1"
clax-hooks = { path = "../clax-hooks" }
clax-content-git = { path = "../clax-content-git" }
clax-git = { path = "../clax-git" }
bytes = "1"
sha2 = "0.11"
reqwest = { workspace = true, features = ["stream"] }
tempfile.workspace = true
clax-fake-exe = { path = "../clax-fake-exe" }
chrono.workspace = true
rusqlite.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-tungstenite.workspace = true
# rmcp's own MCP client over Streamable HTTP (the one Codex embeds), to
# check both `/mcp` endpoints with a real client.
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }

[[test]]
name = "integration"
path = "tests/integration.rs"
