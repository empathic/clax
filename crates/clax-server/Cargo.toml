[package]
name = "clax-server"
version.workspace = true
edition.workspace = true
license.workspace = true
# Every file in tests/ is a module of one of the two integration test
# binaries below.
autotests = false

[lints]
workspace = true

[dependencies]
clax-core = { path = "../clax-core" }
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
nix = { workspace = true, features = ["signal", "resource"] }
socket2 = "0.6"
rand.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures = "0.3"
mime_guess.workspace = true
clax-mcp = { path = "../clax-mcp" }
rmcp = { workspace = true }
reqwest = { workspace = true, features = ["stream", "rustls-tls"] }
base64.workspace = true
sha2 = "0.11"
url.workspace = true

[dev-dependencies]
clax-testkit = { path = "../clax-testkit" }
clax-hooks = { path = "../clax-hooks" }
bytes = "1"
sha2 = "0.11"
reqwest = { workspace = true, features = ["stream"] }
tempfile.workspace = true
clax-fake-exe = { path = "../clax-fake-exe" }
chrono.workspace = true
rusqlite.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-tungstenite.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

# The tests that override the web UI directory, which is process-wide.
[[test]]
name = "web_dist"
path = "tests/web_dist.rs"
