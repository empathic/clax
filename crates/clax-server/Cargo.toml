[package]
name = "clax-server"
version.workspace = true
edition.workspace = true
license.workspace = true
# Every file in tests/ is a module of one of the two integration test
# binaries below.
autotests = false

[lints]
workspace = true

# What builds on both targets: the router, its handlers and their state.
# The daemon around them (sockets, signals, processes, the files of a home)
# is native only; see the crate documentation in src/lib.rs.
[dependencies]
clax-core = { path = "../clax-core" }
clax-rt = { path = "../clax-rt" }
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
rand.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "macros"] }
tokio-stream.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
tower = { workspace = true, features = ["util"] }
tower-http.workspace = true
tracing.workspace = true
futures = "0.3"
mime_guess.workspace = true
clax-mcp = { path = "../clax-mcp" }
reqwest = { workspace = true, features = ["stream"] }
base64.workspace = true
tempfile = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
async-trait = { version = "0.1", optional = true }
sha2 = "0.11"
url.workspace = true
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { workspace = true, features = ["http1", "tokio", "tower-log", "ws"] }
nix = { workspace = true, features = ["signal", "resource"] }
reqwest = { workspace = true, features = ["rustls-tls"] }
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
socket2 = "0.6"
tokio = { workspace = true, features = ["full"] }
tracing-subscriber.workspace = true

# The MCP adapter's tool set holds rmcp's `local` tool router, which is
# not `Send`; a Worker has one thread.
[target.'cfg(target_arch = "wasm32")'.dependencies]
send_wrapper = "0.6"

[features]
test-routes = []
# Exposes `clax_server::testing` (an in-process test daemon) to other crates' tests.
test-support = ["dep:tempfile", "dep:rusqlite", "dep:async-trait"]

[dev-dependencies]
clax-server = { path = ".", features = ["test-routes", "test-support"] }
clax-hooks = { path = "../clax-hooks" }
clax-content-git = { path = "../clax-content-git" }
clax-git = { path = "../clax-git" }
bytes = "1"
sha2 = "0.11"
reqwest = { workspace = true, features = ["stream"] }
tempfile.workspace = true
clax-fake-exe = { path = "../clax-fake-exe" }
chrono.workspace = true
rusqlite.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-tungstenite.workspace = true
# rmcp's own MCP client over Streamable HTTP (the one Codex embeds), to
# check both `/mcp` endpoints with a real client.
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

# The tests that override the web UI directory, which is process-wide.
[[test]]
name = "web_dist"
path = "tests/web_dist.rs"
