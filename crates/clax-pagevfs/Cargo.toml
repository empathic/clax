[package]
name = "clax-pagevfs"
version.workspace = true
edition.workspace = true
license = "GPL-2.0-only OR AGPL-3.0-only"
description = "A thread-safe SQLite VFS that keeps each database's pages in a page store, such as PostgreSQL"

# The workspace's lints, but `unsafe_code` denied rather than forbidden:
# src/lib.rs allows it on its one call to `rsqlite_vfs::register_vfs`, as
# scripts/check-no-unsafe.py checks.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(clax_embedded)', 'cfg(clax_split)', 'cfg(clax_split, values(any()))'] }

[dependencies]
# The VFS glue, natively registered into the SQLite rusqlite links through
# libsqlite3-sys. 0.2 leaves a failed call's message to the backend, which
# keeps it per thread (0.1 kept one for the process in a `RefCell`).
rsqlite-vfs = "0.2"
rusqlite.workspace = true

[dev-dependencies]
clax-core = { path = "../clax-core" }
clax-store = { path = "../clax-store" }
tempfile.workspace = true
