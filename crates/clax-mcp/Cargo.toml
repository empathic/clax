[package]
name = "clax-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
# Every file in tests/ is a module of tests/integration.rs, the one
# integration test binary.
autotests = false

[lints]
workspace = true

# The tool set and its REST client build on both targets; the stdio shim,
# the channel, and what runs programs or reads local files are native only.
[dependencies]
clax-core = { path = "../clax-core" }
clax-rt = { path = "../clax-rt" }
anyhow.workspace = true
http = "1"
base64.workspace = true
bytes.workspace = true
reqwest.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "macros"] }
tracing.workspace = true
url.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, features = ["blocking"] }
rmcp = { workspace = true, features = ["transport-io", "transport-streamable-http-server"] }
tokio = { workspace = true, features = ["full"] }

# rmcp's `local`: the tools' futures need not be `Send`, since on the
# Worker they await `fetch`, which is not. rmcp's session IDs (uuid) draw on
# the Worker's `crypto.getRandomValues`.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
rmcp = { workspace = true, features = ["local"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }

[dev-dependencies]
axum = { workspace = true, features = ["http1", "tokio"] }
clax-server = { path = "../clax-server", features = ["test-support"] }
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
tempfile.workspace = true
rusqlite.workspace = true
clax-fake-exe = { path = "../clax-fake-exe" }

[[test]]
name = "integration"
path = "tests/integration.rs"
