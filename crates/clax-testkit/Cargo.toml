[package]
name = "clax-testkit"
version.workspace = true
edition.workspace = true
license = "GPL-2.0-only OR AGPL-3.0-only"
publish = false

[lints]
workspace = true

[dependencies]
clax-core = { path = "../clax-core" }
clax-store = { path = "../clax-store" }
clax-server = { path = "../clax-server" }
clax-sample = { path = "../clax-sample" }
clax-realtime = { path = "../clax-realtime" }
clax-http = { path = "../clax-http" }
clax-fake-exe = { path = "../clax-fake-exe" }
clax-mcp = { path = "../clax-mcp" }
async-trait = "0.1"
axum = { workspace = true, features = ["http1", "tokio"] }
futures = "0.3"
reqwest = { workspace = true, features = ["stream"] }
rusqlite.workspace = true
serde_json.workspace = true
sha2 = "0.11"
tempfile.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
