[package]
name = "clax-fleet"
version.workspace = true
edition.workspace = true
license = "GPL-2.0-only OR AGPL-3.0-only"
# The tests are the two [[test]] targets below; tests/ holds their modules.
autotests = false
description = "Clax instances across a horizontally scaled set of processes, backed by SQLite or PostgreSQL: the Kubernetes deployment's server"

[lints]
workspace = true

[[bin]]
name = "clax-fleet"
path = "src/main.rs"

[dependencies]
clax-core = { path = "../clax-core" }
clax-store = { path = "../clax-store" }
clax-sample = { path = "../clax-sample" }
clax-realtime = { path = "../clax-realtime" }
clax-http = { path = "../clax-http" }
clax-server = { path = "../clax-server" }
clax-pagevfs = { path = "../clax-pagevfs" }
clax-embedded = { path = "../clax-embedded" }
anyhow.workspace = true
async-trait = "0.1"
axum = { workspace = true, features = ["http1", "tokio", "ws"] }
bytes.workspace = true
clap.workspace = true
futures.workspace = true
http-body-util.workspace = true
# The proxy between processes: a connection per forwarded request, with
# upgrades (the stream's WebSocket).
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
# PostgreSQL, synchronous: the VFS and the content store call it from the
# store's threads (`pg::Pool` keeps each client on a thread of its own).
postgres = "0.19"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
tokio = { workspace = true, features = ["full"] }
toml.workspace = true
tower = { workspace = true, features = ["util"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
url.workspace = true

[dev-dependencies]
reqwest.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

# Against a PostgreSQL server named by CLAX_TEST_PG_URL; every test is
# ignored without it (`just fleet-pg-test`).
[[test]]
name = "postgres"
path = "tests/postgres.rs"
